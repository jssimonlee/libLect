name = "liblect-proxy"
main = "worker.js"
compatibility_date = "2026-05-26"

# 30분 간격 정기 크론 트리거 (기존 백그라운드 싱크 유지)
[triggers]
crons = ["*/30 * * * *"]

# Cloudflare D1 데이터베이스 바인딩 설정
# 주의: 실제로 배포하기 전에 wrangler d1 create로 데이터베이스를 만든 후 database_id를 업데이트해야 합니다.
[[d1_databases]]
binding = "DB"
database_name = "liblect-db"
database_id = "52be7822-3f83-4ef5-9b7e-9a6c7442146c"
