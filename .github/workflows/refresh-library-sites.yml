name: Refresh one library site

on:
  schedule:
    # 03:30 Asia/Seoul. One of 22 site groups is refreshed per run.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-library-sites
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pypdf

      - name: Refresh the oldest site only
        run: python scripts/scrape_library_sites.py --one --workers 1 --delay 1.2

      - name: Rebuild search data without touching regulations
        run: python scripts/build_rules_data.py --reuse-existing-regulations --preserve-curated-versions

      - name: Verify search behavior
        run: npm test

      - name: Reject unsafe or unrelated output
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(library-sites-data\.json|library-update-state\.json|rules-data\.js)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            echo "$unexpected"
            exit 1
          fi

      - name: Commit verified refresh
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library-sites-data.json library-update-state.json rules-data.js
          git commit -m "chore: refresh one library site"
          git push origin main
