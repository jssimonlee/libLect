<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화성시 도서관 강좌 검색</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .hero-combined-container {
            max-width: 1060px;
            margin: 3rem auto 2rem;
            width: calc(100% - 2rem);
            background: linear-gradient(135deg, #ebdccb 0%, #d9c4b1 100%);
            background-image: 
                radial-gradient(at 0% 0%, rgba(217, 119, 6, 0.08) 0px, transparent 40%),
                radial-gradient(at 100% 100%, rgba(120, 53, 4, 0.08) 0px, transparent 40%);
            border-radius: 24px;
            padding: 1.6rem 2rem 1.6rem;
            box-shadow: 0 20px 40px -15px rgba(90, 70, 55, 0.12),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            position: relative;
            overflow: hidden;
            border: 1px solid #d0bfae;
        }

        .hero-combined-container::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 50%;
            height: 70%;
            background: radial-gradient(circle, rgba(253, 186, 116, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        header {
            background: none;
            color: #faf7f2;
            padding: 0 0 1rem;
            text-align: center;
            position: relative;
            border-bottom: none;
            box-shadow: none;
            overflow: visible;
        }

        header::before {
            display: none;
        }

        .header-badge-light {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #3b2314;
            padding: 0.32rem 0.8rem;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 700;
            color: #fdfbf7;
            border: 1px solid #271a11;
            margin-left: 0;
            vertical-align: middle;
            position: relative;
            z-index: 2;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.12);
        }

        .header-badge-light:hover {
            background: #503421;
            border-color: #3b2314;
        }

        .header-badge-light.secondary {
            background: #4a3525;
            color: #faf7f2;
            border-color: #382011;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #84cc16; /* Pulse Lime Green */
            border-radius: 50%;
            display: inline-block;
            animation: badgePulse 2s infinite;
        }

        .header-badge-light.secondary .badge-dot {
            background-color: #fb923c; /* Peach Orange */
            animation: badgePulseSecondary 2s infinite;
        }

        @keyframes badgePulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(132, 204, 22, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 4px rgba(132, 204, 22, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(132, 204, 22, 0); }
        }

        @keyframes badgePulseSecondary {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 4px rgba(251, 146, 60, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(251, 146, 60, 0); }
        }

        header h1 {
            font-family: 'Plus Jakarta Sans', 'Pretendard', sans-serif;
            font-size: 1.85rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #3b2314;
            line-height: 1.2;
            position: relative;
            z-index: 2;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        .header-badges {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 0.5rem;
            position: relative;
            z-index: 2;
        }

        header p.header-desc strong {
            color: #f59e0b;
            font-weight: 700;
        }

        .search-box-wrapper {
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 1.25rem 1.5rem;
            border: 1px solid #e2e8f0;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .search-box:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 
                        0 10px 10px -5px rgba(0, 0, 0, 0.03);
        }

        .search-row {
            display: grid;
            grid-template-columns: minmax(220px, 0.85fr) minmax(260px, 1.15fr) auto;
            gap: 1rem;
            align-items: center;
        }

        .search-field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .search-field label {
            color: #475569;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding-left: 0.25rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            width: 1.1rem;
            height: 1.1rem;
            color: #64748b;
            pointer-events: none;
            transition: color 0.2s ease;
            z-index: 5;
        }

        .select-chevron {
            position: absolute;
            right: 1rem;
            width: 1rem;
            height: 1rem;
            color: #64748b;
            pointer-events: none;
            transition: color 0.2s ease;
            z-index: 5;
        }

        .search-box input[type="text"],
        .search-box select {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 2.6rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s ease-in-out;
            background: #f8fafc;
            color: #0f172a;
            appearance: none;
        }

        .search-box select {
            padding-right: 2.6rem;
            cursor: pointer;
        }

        .search-box input[type="text"]::placeholder {
            color: #94a3b8;
        }

        .search-box input[type="text"]:focus,
        .search-box select:focus {
            border-color: #d97706;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.15);
        }

        .input-wrapper:focus-within .input-icon,
        .input-wrapper:focus-within .select-chevron {
            color: #d97706;
        }

        #searchBtn {
            padding: 0 2rem;
            background: linear-gradient(135deg, #d97706, #b45309);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            align-self: end;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);
        }

        #searchBtn:hover {
            background: linear-gradient(135deg, #ea580c, #d97706);
            box-shadow: 0 6px 20px rgba(217, 119, 6, 0.45);
            transform: translateY(-1px);
        }

        #searchBtn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(217, 119, 6, 0.3);
        }

        #searchBtn:disabled {
            background: #78716c;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            opacity: 0.5;
        }

        .btn-icon {
            width: 1.15rem;
            height: 1.15rem;
            stroke-width: 2.5px;
        }

        .filter-row {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            margin-top: 1.25rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e2e8f0;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 0.25rem;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
        }

        .filter-row::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .filter-btn {
            padding: 0.25rem 0.55rem;
            border: 1px solid #e2e8f0;
            border-radius: 99px;
            background: #f8fafc;
            font-size: 0.73rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: #64748b;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .filter-btn:hover {
            transform: translateY(-1px);
            background: #f1f5f9;
            color: #0f172a;
            border-color: #cbd5e1;
        }

        .filter-btn:not(.date-select)::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: currentColor;
            opacity: 0.6;
            transition: all 0.2s ease;
        }

        .filter-btn.active:not(.date-select)::before {
            opacity: 1;
            transform: scale(1.2);
        }

        /* Active states - Warm and vibrant tones matching brown theme */
        .filter-btn.all.active { background: #d97706; color: white; border-color: #d97706; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.35); }
        .filter-btn.today.active { background: #84cc16; color: white; border-color: #84cc16; box-shadow: 0 4px 12px rgba(132, 204, 22, 0.35); }
        .filter-btn.tomorrow.active { background: #f59e0b; color: white; border-color: #f59e0b; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.35); }
        .filter-btn.date-select.active { background: #06b6d4; color: white; border-color: #06b6d4; box-shadow: 0 4px 12px rgba(6, 182, 212, 0.35); }
        .filter-btn.open.active { background: #10b981; color: white; border-color: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35); }
        .filter-btn.upcoming.active { background: #3b82f6; color: white; border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35); }
        .filter-btn.closed.active { background: #ef4444; color: white; border-color: #ef4444; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.35); }
        .filter-btn.ended.active { background: #78716c; color: white; border-color: #78716c; box-shadow: 0 4px 12px rgba(120, 113, 108, 0.35); }
        .filter-btn.canceled.active { background: #991b1b; color: white; border-color: #991b1b; box-shadow: 0 4px 12px rgba(153, 27, 27, 0.35); }

        .filter-btn.active {
            transform: translateY(-1px);
            font-weight: 700;
        }

        .clear-date-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-size: 0.6rem;
            line-height: 1;
            cursor: pointer;
            transition: all 0.15s ease;
            vertical-align: middle;
        }

        .clear-date-btn:hover {
            background: #ef4444;
            color: #ffffff !important;
        }

        .filter-btn.all { background: #f5f3ff; border-color: #e0e7ff; color: #4f46e5; }
        .filter-btn.all:hover { background: #eeeafb; border-color: #c7d2fe; }

        .filter-btn.today { background: #f0fdf4; border-color: #dcfce7; color: #10b981; }
        .filter-btn.today:hover { background: #e6fbe8; border-color: #bbf7d0; }

        .filter-btn.tomorrow { background: #fffbeb; border-color: #fef3c7; color: #d97706; }
        .filter-btn.tomorrow:hover { background: #fff3d6; border-color: #fde68a; }

        .filter-btn.date-select { background: #ecfeff; border-color: #cffafe; color: #0891b2; }
        .filter-btn.date-select:hover { background: #d2fbfe; border-color: #a5f3fc; }

        .filter-btn.open { background: #f0fdf4; border-color: #dcfce7; color: #10b981; }
        .filter-btn.open:hover { background: #e6fbe8; border-color: #bbf7d0; }

        .filter-btn.upcoming { background: #eff6ff; border-color: #dbeafe; color: #2563eb; }
        .filter-btn.upcoming:hover { background: #e0ecff; border-color: #bfdbfe; }

        .filter-btn.closed { background: #fef2f2; border-color: #fee2e2; color: #dc2626; }
        .filter-btn.closed:hover { background: #ffe4e4; border-color: #fecaca; }

        .filter-btn.ended { background: #f8fafc; border-color: #e2e8f0; color: #64748b; }
        .filter-btn.ended:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .filter-btn.canceled { background: #fef2f2; border-color: #fee2e2; color: #991b1b; }
        .filter-btn.canceled:hover { background: #ffe4e4; border-color: #fecaca; }

        .main-content {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem 3rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.2rem;
            width: 100%;
            flex-wrap: wrap;
        }

        @media (max-width: 768px) {
            .status-bar {
                justify-content: center;
                flex-direction: column;
                gap: 0.6rem;
            }
        }

        .result-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0.45rem 1.2rem;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.05);
            font-size: 0.76rem;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.2s ease-in-out;
        }

        .result-count:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(148, 163, 184, 0.1);
            border-color: #cbd5e0;
        }

        .count-segment {
            display: inline-flex;
            align-items: center;
        }

        .count-segment.total {
            color: #4a5568;
        }

        .count-segment strong {
            color: #3182ce;
            font-weight: 800;
            font-size: 0.82rem;
            margin-left: 0.15rem;
            margin-right: 0.15rem;
        }

        .count-segment.filter {
            color: #2b6cb0;
        }

        .count-segment.inst {
            color: #2c5282;
        }

        .count-segment.keyword {
            color: #4a5568;
            font-style: italic;
        }

        .count-divider {
            display: inline-block;
            width: 1px;
            height: 10px;
            background-color: #cbd5e0;
            margin: 0 0.6rem;
            align-self: center;
        }

        .sort-select {
            padding: 0.4rem 0.8rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background: white;
        }

        /* Loading & Skeleton Screen */
        .loading {
            text-align: center;
            padding: 4rem 1rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #d97706;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading p {
            color: #718096;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 1.5rem;
            width: 100%;
            margin-top: 1.5rem;
        }

        .skeleton-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid #edf2f7;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .skeleton-card::after {
            content: "";
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(
                90deg,
                rgba(240, 240, 240, 0) 0%,
                rgba(240, 240, 240, 0.5) 20%,
                rgba(240, 240, 240, 0.5) 60%,
                rgba(240, 240, 240, 0) 100%
            );
            transform: translateX(-100%);
            animation: skeleton-shimmer 1.5s infinite;
        }

        @keyframes skeleton-shimmer {
            100% { transform: translateX(100%); }
        }

        .skeleton-line {
            background: #e2e8f0;
            border-radius: 6px;
            margin-bottom: 0.75rem;
        }

        .skeleton-line.badge { width: 25%; height: 22px; margin-bottom: 1.2rem; }
        .skeleton-line.inst { width: 45%; height: 14px; }
        .skeleton-line.title { width: 85%; height: 20px; margin: 0.8rem 0; }
        .skeleton-line.desc { width: 100%; height: 12px; margin-bottom: 0.5rem; }
        .skeleton-line.desc-short { width: 70%; height: 12px; }
        .skeleton-line.tag { display: inline-block; width: 22%; height: 26px; border-radius: 12px; margin-right: 0.5rem; }
        .skeleton-line.footer { width: 50%; height: 14px; margin-top: 1rem; }

        .progress-bar-container {
            max-width: 300px;
            margin: 0.75rem auto 0;
            background: #e2e8f0;
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4c51bf, #2b6cb0);
            border-radius: 8px;
            transition: width 0.3s;
            width: 0%;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: #a0aec0;
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { font-size: 1.15rem; color: #718096; margin-bottom: 0.5rem; }
        .empty-state p { font-size: 0.9rem; }

        /* Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
            padding: 1.3rem;
            transition: transform 0.16s ease, border-color 0.16s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
            contain: content;
        }

        .card:hover {
            border-color: #bee3f8;
            transform: translateY(-2px);
        }

        .card.status-open { border-left: 4px solid #9ae6b4; }
        .card.status-upcoming { border-left: 4px solid #90cdf4; }
        .card.status-closed { border-left: 4px solid #feb2b2; }
        .card.status-ended { border-left: 4px solid #cbd5e0; }

        @keyframes todayGlowPulse {
            0% {
                box-shadow: 0 0 0 1px rgba(190,242,100,0.55), 0 0 14px rgba(190,242,100,0.35);
            }
            50% {
                box-shadow: 0 0 0 3px rgba(190,242,100,0.7), 0 0 28px rgba(190,242,100,0.55);
            }
            100% {
                box-shadow: 0 0 0 1px rgba(190,242,100,0.55), 0 0 14px rgba(190,242,100,0.35);
            }
        }

        .card.today-card {
            border-color: #c6f970;
            border-left-color: #b8f26a;
            animation: todayGlowPulse 2.5s infinite ease-in-out;
        }

        .card.tomorrow-card {
            border-color: #fcd34d;
            border-left-color: #fbbf24;
            box-shadow: 0 0 0 1px rgba(251,191,36,0.3), 0 4px 16px rgba(251,191,36,0.15);
        }

        .card-status {
            position: absolute;
            top: 0;
            right: 0;
            padding: 0.35rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0 14px 0 10px;
        }

        .card-status.open { background: #c6f6d5; color: #22543d; }
        .card-status.upcoming { background: #bee3f8; color: #2a4365; }
        .card-status.closed { background: #fed7d7; color: #742a2a; }
        .card-status.ended { background: #e2e8f0; color: #4a5568; }
        .card-status.canceled { background: #fee2e2; color: #991b1b; border-left: 1px solid rgba(239,68,68,0.2); border-bottom: 1px solid rgba(239,68,68,0.2); }

        .card.canceled-card {
            border: 1px dashed rgba(153, 27, 27, 0.35) !important;
            background: rgba(254, 242, 242, 0.3) !important;
            opacity: 0.8 !important;
            box-shadow: none !important;
        }
        .card.canceled-card .card-title {
            text-decoration: line-through;
            color: #78716c;
        }

        .today-badge-group {
            display: flex;
            gap: 0.35rem;
            align-items: center;
            margin-bottom: 0.45rem;
            align-self: flex-start;
        }

        .today-badge {
            padding: 0.24rem 0.62rem;
            border-radius: 999px;
            background: #dfff8f;
            color: #22543d;
            border: 1px solid #b8f26a;
            box-shadow: 0 0 16px rgba(190,242,100,0.8);
            font-size: 0.74rem;
            font-weight: 700;
        }

        .today-sub-badge {
            padding: 0.24rem 0.62rem;
            border-radius: 999px;
            font-size: 0.74rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            line-height: 1;
        }

    <div class="hero-combined-container">
        <header>
            <h1>화성시 도서관 강좌 검색</h1>
            <div class="header-badges">
                <span class="header-badge-light">
                    <span class="badge-dot"></span>
                    실시간 연동
                </span>
                <span class="header-badge-light secondary">
                    <span class="badge-dot"></span>
                    최근 6개월 데이터
                </span>
            </div>
        </header>

        <div class="search-box">
            <div class="search-row">
                <div class="search-field">
                    <label for="institutionSelect">도서관 기관</label>
                    <div style="display: flex; gap: 0.5rem; width: 100%;">

                            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><path d="M12 2 3 7h18Z"/></svg>
                            <select id="institutionSelect" style="width: 100%;">
                                <option value="">전체 도서관</option>
                            </select>
                            <svg class="select-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                        <button id="favoriteConfigBtn" type="button" title="즐겨찾기 설정" style="background: rgba(234, 179, 8, 0.05); border: 1px solid rgba(234, 179, 8, 0.2); border-radius: 12px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #eab308; cursor: pointer; transition: all 0.2s ease; flex-shrink: 0;" onmouseover="this.style.background='rgba(234, 179, 8, 0.15)'; this.style.borderColor='rgba(234, 179, 8, 0.4)'; this.style.transform='scale(1.05)';" onmouseout="this.style.background='rgba(234, 179, 8, 0.05)'; this.style.borderColor='rgba(234, 179, 8, 0.2)'; this.style.transform='scale(1)';">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                        </button>
                    </div>
                </div>
                <div class="search-field">
                    <label for="searchInput">강좌 검색어</label>
                    <div class="input-wrapper search-wrapper">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        <input type="text" id="searchInput" placeholder="강좌명, 대상, 장소, 무료 여부 등" autocomplete="off">
                    </div>
                </div>
                <button id="searchBtn" onclick="doSearch()">
                    <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <span>검색</span>
                </button>
            </div>
            <div class="filter-row">
                <button class="filter-btn all active" data-filter="all" onclick="setFilter('all', this)">전체(0)</button>
                <button class="filter-btn today" data-filter="today" onclick="setFilter('today', this)">오늘수업(0)</button>
                <button class="filter-btn tomorrow" data-filter="tomorrow" onclick="setFilter('tomorrow', this)">내일수업(0)</button>
                <button class="filter-btn date-select" data-filter="date" onclick="openDatePicker(this)">📅 달력선택</button>
                <input type="date" id="filterDatePicker" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1px; height: 1px; opacity: 0; pointer-events: none; border: none; outline: none; padding: 0; margin: 0; z-index: -9999;" onchange="handleDateSelected(this.value)">
                <button class="filter-btn open" data-filter="접수중" onclick="setFilter('접수중', this)">접수중(0)</button>
                <button class="filter-btn upcoming" data-filter="접수예정" onclick="setFilter('접수예정', this)">접수예정(0)</button>
                <button class="filter-btn closed" data-filter="접수마감" onclick="setFilter('접수마감', this)">접수마감(0)</button>
                <button class="filter-btn ended" data-filter="강좌종료" onclick="setFilter('강좌종료', this)">강좌종료(0)</button>
                <button class="filter-btn canceled" data-filter="폐강" onclick="setFilter('폐강', this)">폐강(0)</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="content">
            <div class="empty-state">
                <div class="icon">&#128218;</div>
                <h3>도서관을 선택하거나 검색어를 입력해 보세요</h3>
                <p>강좌명, 대상, 장소, 무료 여부까지 한 번에 검색할 수 있습니다</p>
            </div>
        </div>
    </div>

    <script>
        // ── 프록시 설정 ──────────────────────────────────────────────
        // Cloudflare Worker URL을 배포한 뒤 아래 값을 교체하세요.
        // 예) 'https://liblect-proxy.YOUR-SUBDOMAIN.workers.dev'
        // 비워두면 로컬 서버(/api/)로 폴백합니다.
        const WORKER_BASE = 'https://liblect-proxy.jssimonlee.workers.dev/';

        const LIBRARY_DATA_API = WORKER_BASE
            ? WORKER_BASE.replace(/\/$/, '') + '/api/libraryLectures'
            : '/api/libraryLectures';

        const ASSIGNEES_API = WORKER_BASE
            ? WORKER_BASE.replace(/\/$/, '') + '/api/assignees'
            : '/api/assignees';

        const ASSIGNEE_API = WORKER_BASE
            ? WORKER_BASE.replace(/\/$/, '') + '/api/assignee'
            : '/api/assignee';
        // ────────────────────────────────────────────────────────────

        const CARDS_PER_PAGE = 12;   // 화면에 보여주는 카드 수

        // 상태 관리
        let libraryData = [];         // 최근 6개월 안의 도서관 데이터
        let allData = [];             // 현재 검색어에 매칭된 데이터
        let currentFilter = 'all';
        let displayPage = 1;          // 현재 보고 있는 표시 페이지
        let searchDone = true;        // 현재 데이터셋 안에서 검색이 끝났는지
        let dataLoadDone = false;     // 최근 도서관 데이터셋을 만들었는지
        let isLoading = false;
        let isBackgroundSyncing = false; // 2단계 백그라운드 전체 동기화 실행 여부
        
        let myLibraryFavorite = [];
        try {
            const savedFav = localStorage.getItem('myLibraryFavorite');
            if (savedFav) {
                myLibraryFavorite = JSON.parse(savedFav);
            }
        } catch (e) {
            console.error('Failed to load myLibraryFavorite:', e);
        }

        // ── 담당자 등록 기능 ──────────────────────────────────
        let isIncognito = false;
        let assigneeData = {}; // { lectureKey: { name: '홍길동', masked: '*길*' } }

        // 시크릿(프라이빗) 모드 감지
        function detectIncognito() {
            return new Promise(resolve => {
                try {
                    // Storage estimate 기반 탐지 (Chrome)
                    if (navigator.storage && navigator.storage.estimate) {
                        navigator.storage.estimate().then(est => {
                            // 시크릿 모드에서는 quota가 매우 작음 (약 120MB 이하)
                            if (est.quota && est.quota < 130 * 1024 * 1024) {
                                resolve(true);
                            } else {
                                resolve(false);
                            }
                        }).catch(() => resolve(false));
                    } else {
                        resolve(false);
                    }
                } catch (e) {
                    resolve(false);
                }
            });
        }

        // 강좌 고유 키 생성
        function getLectureKey(d) {
            // lectureIdx가 가장 신뢰할 수 있는 ID, 없으면 institution+name 조합
            if (d.lectureIdx) return d.lectureIdx;
            return (d.institution || '') + '::' + (d.name || '');
        }

        // 담당자 데이터 로드 (D1 DB 비동기 호출)
        async function loadAssigneeData() {
            try {
                const response = await fetch(ASSIGNEES_API);
                if (response.ok) {
                    assigneeData = await response.json();
                } else {
                    console.error('Failed to load assignee data from server:', response.status);
                }
            } catch (e) {
                console.error('Failed to fetch assignee data:', e);
            }
        }

        // 이름 마스킹 옵션 생성 (2글자, 3글자, 4글자 이상 대응)
        function generateMaskOptions(fullName) {
            const name = fullName.trim();
            if (name.length < 2) return [];
            const stars = (n) => '*'.repeat(n);
            const options = [];
            if (name.length === 2) {
                // 2글자: 홍* , *동
                options.push(name[0] + stars(1));
                options.push(stars(1) + name[1]);
            } else if (name.length === 3) {
                // 3글자: 홍**, *길*, **동
                options.push(name[0] + stars(2));
                options.push(stars(1) + name[1] + stars(1));
                options.push(stars(2) + name[2]);
            } else {
                // 4글자 이상: 첫글자만, 중간글자만, 끝글자만
                const len = name.length;
                options.push(name[0] + stars(len - 1));
                const mid = Math.floor(len / 2);
                options.push(stars(mid) + name[mid] + stars(len - mid - 1));
                options.push(stars(len - 1) + name[len - 1]);
            }
            return options;
        }

        // 속성용 이스케이프 (따옴표 포함)
        function escapeAttr(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        const ASSIGNEE_COLORS = [
            '#ef4444', // Red (선명한 빨간색)
            '#3b82f6', // Blue (선명한 파란색)
            '#10b981', // Green (선명한 초록색)
            '#eab308', // Yellow (선명한 노란색)
            '#a7f3d0', // Mint (선명한 민트색)
            '#1f2937'  // Black (선명한 검은색)
        ];

        let selectedColor = '#ef4444';

        function renderColorPalette(activeColor) {
            selectedColor = activeColor;
            const palette = document.getElementById('assigneeColorPalette');
            if (!palette) return;

            palette.innerHTML = ASSIGNEE_COLORS.map(c => {
                const isLightColor = c === '#eab308' || c === '#a7f3d0';
                const checkColor = isLightColor ? '#1f2937' : '#ffffff';
                const textShadow = isLightColor ? 'none' : '0 1px 3px rgba(0,0,0,0.5)';
                return `<button type="button" class="assignee-color-btn ${c === activeColor ? 'selected' : ''}" style="background-color: ${c}; position: relative;" onclick="selectColor('${c}')" title="${getColorName(c)}">
                    ${c === activeColor ? `<span style="color:${checkColor}; font-size:16px; font-weight:900; position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); pointer-events:none; text-shadow: ${textShadow};">✓</span>` : ''}
                </button>`;
            }).join('');
        }

        window.selectColor = function(color) {
            renderColorPalette(color);
        };

        function getColorName(c) {
            const names = {
                '#ef4444': '빨간색',
                '#3b82f6': '파란색',
                '#10b981': '초록색',
                '#eab308': '노란색',
                '#a7f3d0': '민트색',
                '#1f2937': '검은색'
            };
            return names[c] || '기본 색상';
        }

        function findPreviousColorForAssignee(currentInstitution, currentName) {
            if (!currentInstitution || !currentName) return '';
            for (const [key, value] of Object.entries(assigneeData)) {
                const item = libraryData.find(l => String(l.lectureIdx) === String(key) || `${l.institution}::${l.name}` === String(key));
                if (item && item.institution === currentInstitution && value.name === currentName) {
                    if (value.color && value.color !== 'default') {
                        return value.color;
                    }
                }
            }
            return '';
        }

        // 3버튼 커스텀 다이얼로그를 동적으로 띄우는 함수
        function showColorChoiceDialog(oldColor, newColor, onChoice) {
            const oldName = getColorName(oldColor);
            const newName = getColorName(newColor);
            
            const overlay = document.createElement('div');
            overlay.className = 'color-choice-overlay';
            overlay.id = 'colorChoiceOverlay';
            
            overlay.innerHTML = `
                <div class="color-choice-dialog">
                    <h4>⚠️ 담당자 색상 변경 설정</h4>
                    <div class="dialog-body">
                        이 도서관에 동일한 이름의 담당자에게 이미 다른 색상(<strong>[${oldName}]</strong>)이 지정되어 있었습니다.<br><br>
                        원하시는 저장 방식을 선택해 주세요:
                    </div>
                    <div class="color-choice-btn-group">
                        <button type="button" class="color-choice-btn choice-all" onclick="handleChoice('all')">이 담당자의 전체 강좌 색상 일괄 변경</button>
                        <button type="button" class="color-choice-btn choice-only" onclick="handleChoice('only')">이 강좌만 개별 색상 변경</button>
                        <button type="button" class="color-choice-btn choice-cancel" onclick="handleChoice('cancel')">취소</button>
                    </div>
                </div>
            `;
            
            document.body.appendChild(overlay);
            
            window.handleChoice = function(choice) {
                document.body.removeChild(overlay);
                onChoice(choice);
            };
        }

        // 담당자 버튼 HTML 렌더링
        function renderAssigneeButton(d) {
            const key = getLectureKey(d);
            const info = assigneeData[key];
            const safeKey = escapeAttr(key);
            if (info && info.masked) {
                const color = info.color || '#ef4444';
                return `<button class="assignee-btn set" data-lecture-key="${safeKey}" data-edit="1" title="담당자 수정" style="--assignee-color: ${color};">
                    <span class="assignee-left-bar"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="assignee-svg-icon"><path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z" clip-rule="evenodd" /></svg>
                    담당: ${escapeHtml(info.masked)}
                </button>`;
            }
            return `<button class="assignee-btn unset" data-lecture-key="${safeKey}" data-edit="0" title="담당자 등록"><span class="assignee-icon">✏️</span>담당자등록</button>`;
        }

        // 이벤트 위임: 카드 영역의 담당자 버튼 클릭 처리
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.assignee-btn');
            if (!btn) return;
            e.stopPropagation();
            const key = btn.dataset.lectureKey;
            const isEdit = btn.dataset.edit === '1';
            if (key) openAssigneePopover(key, isEdit);
        });

        // 담당자 팝오버 열기
        function openAssigneePopover(lectureKey, isEdit) {
            // 기존 팝오버 제거
            closeAssigneePopover();

            const existing = assigneeData[lectureKey];
            const existingName = existing ? existing.name : '';
            const existingMasked = existing ? existing.masked : '';
            const existingColor = existing ? existing.color : '#ef4444';

            // 기존 마스킹 옵션 변수 초기화
            selectedMask = existingMasked;

            const overlay = document.createElement('div');
            overlay.className = 'assignee-popover-overlay';
            overlay.id = 'assigneePopoverOverlay';
            overlay.onclick = (e) => { if (e.target === overlay) closeAssigneePopover(); };

            const pop = document.createElement('div');
            pop.className = 'assignee-popover';

            let html = `
                <h4>${isEdit ? '👤 담당자 수정' : '✏️ 담당자 등록'}</h4>
                <div class="pop-subtitle">이름을 입력하면 보호된 표시 옵션을 선택할 수 있습니다</div>
                <div class="pop-input-wrap">
                    <input type="text" id="assigneeNameInput" placeholder="이름을 입력하세요 (예: 홍길동)" value="${escapeHtml(existingName)}" maxlength="10" autocomplete="off" />
                </div>
                <div class="assignee-mask-options" id="assigneeMaskOptions"></div>
                <div class="pop-subtitle" style="margin-top: 1.25rem; font-weight:600; color:#5c4033;">🎨 담당자 고유 색상 선택</div>
                <div class="assignee-color-palette" id="assigneeColorPalette"></div>
                <div class="assignee-pop-actions">
                    ${isEdit ? '<button class="pop-delete" onclick="deleteAssignee()">삭제</button>' : ''}
                    <button class="pop-cancel" onclick="closeAssigneePopover()">취소</button>
                    <button class="pop-save" id="assigneeSaveBtn" disabled onclick="saveAssignee()">저장</button>
                </div>
            `;

            pop.innerHTML = html;
            overlay.appendChild(pop);
            document.body.appendChild(overlay);

            // 현재 편집중인 키를 저장
            overlay.dataset.lectureKey = lectureKey;

            const nameInput = document.getElementById('assigneeNameInput');
            nameInput.addEventListener('input', () => {
                const val = nameInput.value.trim();
                updateMaskOptions(nameInput.value);

                // 동일 도서관 내의 동일 이름이 등록된 적이 있는지 자동 추적하여 추천 선택
                const d = libraryData.find(item => String(item.lectureIdx) === String(lectureKey) || `${item.institution}::${item.name}` === String(lectureKey));
                const currentInst = d ? d.institution : '';
                const prevColor = findPreviousColorForAssignee(currentInst, val);
                if (prevColor) {
                    renderColorPalette(prevColor);
                }
            });

            // 기존 색상 또는 기본 색상 팔레트 렌더링
            setTimeout(() => {
                renderColorPalette(existingColor);
            }, 20);

            // 기존 이름이 있으면 마스크 옵션 즉시 표시
            if (existingName) {
                setTimeout(() => {
                    updateMaskOptions(existingName);
                    // 기존 선택값 하이라이트
                    if (existingMasked) {
                        const btns = document.querySelectorAll('.assignee-mask-btn');
                        btns.forEach(b => {
                            if (b.textContent === existingMasked) {
                                b.classList.add('selected');
                                document.getElementById('assigneeSaveBtn').disabled = false;
                            }
                        });
                    }
                }, 50);
            }

            // 포커스
            setTimeout(() => nameInput.focus(), 100);
        }

        // 마스크 옵션 업데이트
        function updateMaskOptions(name) {
            const container = document.getElementById('assigneeMaskOptions');
            if (!container) return;

            const options = generateMaskOptions(name);
            if (options.length === 0) {
                container.innerHTML = '<span style="font-size:0.78rem; color:#a0aec0;">2글자 이상 입력해 주세요</span>';
                document.getElementById('assigneeSaveBtn').disabled = true;
                return;
            }

            container.innerHTML = options.map(opt =>
                `<button type="button" class="assignee-mask-btn" onclick="selectMask(this, '${opt}')">${opt}</button>`
            ).join('');
            document.getElementById('assigneeSaveBtn').disabled = true;
        }

        // 마스크 선택
        let selectedMask = '';
        function selectMask(btn, mask) {
            document.querySelectorAll('.assignee-mask-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            selectedMask = mask;
            document.getElementById('assigneeSaveBtn').disabled = false;
        }

        // 저장 (D1 DB 비동기 호출)
        async function saveAssignee() {
            const overlay = document.getElementById('assigneePopoverOverlay');
            if (!overlay) return;
            const lectureKey = overlay.dataset.lectureKey;
            const nameInput = document.getElementById('assigneeNameInput');
            const fullName = nameInput.value.trim();

            if (!fullName || !selectedMask) return;

            const saveBtn = document.getElementById('assigneeSaveBtn');

            // 기존 동일 도서관에 동일 이름으로 등록된 적이 있던 색상 추적 검증
            const d = libraryData.find(item => String(item.lectureIdx) === String(lectureKey) || `${item.institution}::${item.name}` === String(lectureKey));
            const currentInst = d ? d.institution : '';
            const previousColor = findPreviousColorForAssignee(currentInst, fullName);
            
            // 동일 도서관 내에 이 담당자명으로 등록된 강좌 수 계산
            let relatedCount = 0;
            for (const [key, value] of Object.entries(assigneeData)) {
                const item = libraryData.find(l => String(l.lectureIdx) === String(key) || `${l.institution}::${l.name}` === String(key));
                if (item && item.institution === currentInst && value.name === fullName) {
                    relatedCount++;
                }
            }

        };

        function getChosung(str) {
            if (!str) return '';
            const char = str.charAt(0);
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const chosungList = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
                return chosungList[Math.floor((code - 0xAC00) / 588)];
            }
            const singleConsonants = {
                0x3131: 'ㄱ', 0x3132: 'ㄲ', 0x3134: 'ㄴ', 0x3137: 'ㄷ', 0x3138: 'ㄸ', 
                0x3139: 'ㄹ', 0x3141: 'ㅁ', 0x3142: 'ㅂ', 0x3143: 'ㅃ', 0x3145: 'ㅅ', 
                0x3146: 'ㅆ', 0x3147: 'ㅇ', 0x3148: 'ㅈ', 0x3149: 'ㅉ', 0x314a: 'ㅊ', 
                0x314b: 'ㅋ', 0x314c: 'ㅌ', 0x314d: 'ㅍ', 0x314e: 'ㅎ'
            };
            if (singleConsonants[code]) return singleConsonants[code];
            return char.toLowerCase();
        }

        // ── 날짜 및 오늘/내일 강좌 판단 헬퍼 함수 ──
        function getKoreaTodayDateOnly() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Seoul',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
            }).formatToParts(new Date());

            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            return new Date(Date.UTC(Number(values.year), Number(values.month) - 1, Number(values.day)));
        }

        function getKoreaTomorrowDateOnly() {
            const today = getKoreaTodayDateOnly();
            return new Date(today.getTime() + 24 * 60 * 60 * 1000);
        }

        function parseDateOnly(value) {
            if (!value) return null;
            const digits = String(value).replace(/\D/g, '');
            if (digits.length < 8) return null;
            const year = parseInt(digits.slice(0, 4), 10);
            const month = parseInt(digits.slice(4, 6), 10) - 1;
            const day = parseInt(digits.slice(6, 8), 10);
            const date = new Date(Date.UTC(year, month, day));
            if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month || date.getUTCDate() !== day) return null;
            return date;
        }

        function updateLectureState(d) {
            d.isToday = isTodayLecture(d);
            d.isTomorrow = isTomorrowLecture(d);

            const today = getKoreaTodayDateOnly();
            const end = parseDateOnly(d.endDate);
            if (end && today > end) {
                d.status = '강좌종료';
            }
        }

        function getApiDayCode(date) {
            const jsDay = date.getUTCDay();
            return jsDay === 0 ? '7' : String(jsDay);
        }

        function parseDayCodes(dayStr) {
            if (!dayStr) return [];
            const koreanMap = { '월': '1', '화': '2', '수': '3', '목': '4', '금': '5', '토': '6', '일': '7' };
            return String(dayStr)
                .split(/[,/|·\s]+/)
                .map(v => v.trim())
                .filter(Boolean)
                .map(v => v.replace(/요일$/, ''))
                .map(v => koreanMap[v] || v)
                .filter(v => /^[1-7]$/.test(v));
        }

        function isTodayLecture(d) {
            if (isCanceledLecture(d)) {
                return false;
            }
            const today = getKoreaTodayDateOnly();
            const begin = parseDateOnly(d.beginDate);
            const end = parseDateOnly(d.endDate);
            if (!today || !begin || !end) return false;
            if (today < begin || today > end) return false;

            const dayCodes = parseDayCodes(d.dayOfWeek);
            if (dayCodes.length === 0) {
                return begin.getTime() === end.getTime() && today.getTime() === begin.getTime();
            }

            return dayCodes.includes(getApiDayCode(today));
        }

        // 오늘 수업의 시간대별 상태(진행중, 예정, 종료) 판정
        function getTodayLectureTimeStatus(d) {
            if (!d.isToday) return null;

            const now = new Date();
            const currentHour = now.getHours();
            const currentMin = now.getMinutes();
            const currentSec = now.getSeconds();
            const currentTimeInSeconds = (currentHour * 3600) + (currentMin * 60) + currentSec;

            // HH:MM 또는 HH:MM:SS 형식을 초 단위로 변환
            const parseTimeToSeconds = (timeStr) => {
                if (!timeStr) return 0;
                const parts = timeStr.split(':').map(Number);
                const hrs = parts[0] || 0;
                const mins = parts[1] || 0;
                const secs = parts[2] || 0;
                return (hrs * 3600) + (mins * 60) + secs;
            };

            const beginSecs = parseTimeToSeconds(d.beginTime);
            const endSecs = parseTimeToSeconds(d.endTime);

            if (currentTimeInSeconds < beginSecs) {
                return 'upcoming';  // 오늘 중 시작 전 (예정)
            } else if (currentTimeInSeconds >= beginSecs && currentTimeInSeconds <= endSecs) {
                return 'ongoing';   // 수업 진행 중
            } else {
                return 'completed'; // 수업 종료
            }
        }

        function isTomorrowLecture(d) {
            if (isCanceledLecture(d)) {
                return false;
            }
            const tomorrow = getKoreaTomorrowDateOnly();
            const begin = parseDateOnly(d.beginDate);
            const end = parseDateOnly(d.endDate);
            if (!tomorrow || !begin || !end) return false;
            if (tomorrow < begin || tomorrow > end) return false;

            const dayCodes = parseDayCodes(d.dayOfWeek);
            if (dayCodes.length === 0) {
                return begin.getTime() === end.getTime() && tomorrow.getTime() === begin.getTime();
            }

            return dayCodes.includes(getApiDayCode(tomorrow));
        }

        const CACHE_KEYS = {

        function getLectureKey(d) {
            return d.lectureIdx || `${d.institution}_${d.name}_${d.beginDate}`;
        }

        function mergeLectures(existing, newItems) {
            const mergedMap = new Map();
            // 1. 기존 캐시 데이터 맵에 채우기
            existing.forEach(item => {
                const key = getLectureKey(item);
                if (key) mergedMap.set(key, item);
            });
            // 2. 신규 데이터 덮어쓰기 (실시간 인원 수, 상태 갱신 반영)
            newItems.forEach(item => {
                const key = getLectureKey(item);
                if (key) mergedMap.set(key, item);
            });
            // 3. 배열로 반환 및 beginDate 내림차순(최신순) 정렬
            return Array.from(mergedMap.values()).sort((a, b) => {
                return (b.beginDate || '').localeCompare(a.beginDate || '');
            });
        }

        function getRelativeTimeText(timestampMs) {
            if (!timestampMs) return '알 수 없음';
            const diffMs = Date.now() - timestampMs;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);

            if (diffSec < 60) return '방금 전 데이터';
            if (diffMin < 60) return `${diffMin}분 전 데이터`;
            if (diffHour < 24) return `${diffHour}시간 전 데이터`;
            return `${diffDay}일 전 데이터`;
        }

        function updateFreshnessBar() {

            let ts = 0;
            if (lastSync) {
                if (/^\d+$/.test(lastSync)) {
                    ts = parseInt(lastSync, 10);
                } else {
                    ts = Date.parse(lastSync) || 0;
                }
            }

            if (ts > 0) {
                textEl.innerHTML = `<span class="freshness-time">${getRelativeTimeText(ts)}</span>`;
                bar.classList.add('visible');
            } else {
                bar.classList.remove('visible');
            }
        }

        // 1분마다 신선도 텍스트 자동 갱신
        setInterval(updateFreshnessBar, 60 * 1000);

        // ── 브라우저 정기 백그라운드 자동 동기화 (Smart Silent Sync) ──
        async function silentBackgroundSync() {
            if (isLoading || isBackgroundSyncing) return;

            try {
                const lastSync = localStorage.getItem(CACHE_KEYS.lastSync);
                let localTs = 0;
                if (lastSync) {
                    localTs = /^\d+$/.test(lastSync) ? parseInt(lastSync, 10) : (Date.parse(lastSync) || 0);
                }

                const res = await fetch(LIBRARY_DATA_API);
                if (!res.ok) return;

                const payload = await res.json();
                const remoteTs = payload.meta && payload.meta.generatedAt
                    ? (isNaN(payload.meta.generatedAt) ? Date.parse(payload.meta.generatedAt) : Number(payload.meta.generatedAt))
                    : 0;

                // 서버의 데이터가 로컬 데이터보다 새로운 경우에만 조용히 업데이트
                if (remoteTs > localTs) {
                    const rawFetched = Array.isArray(payload.lectures) ? payload.lectures : [];
                    const fetchedLectures = rawFetched.filter(d => !isWholeSetLoan(d));

                    if (fetchedLectures.length > 0) {
                        libraryData = fetchedLectures;

                        libraryData.forEach(d => {
                            updateLectureState(d);
                        });

                        datasetMeta = payload.meta || datasetMeta;

                        const newInsts = Array.isArray(payload.institutions)
                            ? payload.institutions
                            : fetchedLectures.map(d => d.institution).filter(Boolean);
                        
                        newInsts.forEach(inst => institutionNames.add(inst));

                        const currentSelected = institutionSelect.value;
                        populateInstitutionSelect();
                        if (currentSelected && [...institutionNames].includes(currentSelected)) {
                            institutionSelect.value = currentSelected;
                        }

                        saveCacheToLocalStorage(libraryData, datasetMeta, institutionNames, remoteTs);

                        allData = getSearchBaseData();
                        updateFilterButtons(getFilterCounts(allData));
                        renderResults();

                        showSyncBadge('✨ 최신 강좌 정보 자동 업데이트 완료!', 'success');
                    }
                }
            } catch (err) {
                console.error('Silent background sync failed:', err);
            }
        }

        // 30분마다 정기 백그라운드 자동 동기화 실행 (사이트가 켜져 있는 동안)
        setInterval(silentBackgroundSync, 30 * 60 * 1000);

        // 사용자가 다른 탭/작업을 하다가 브라우저 탭으로 돌아왔을 때 마지막 동기화 후 30분이 넘었다면 실시간 동기화
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                const lastSync = localStorage.getItem(CACHE_KEYS.lastSync);
                let localTs = 0;
                if (lastSync) {
                    localTs = /^\d+$/.test(lastSync) ? parseInt(lastSync, 10) : (Date.parse(lastSync) || 0);
                }
                const timeDiff = Date.now() - localTs;
                if (timeDiff > 30 * 60 * 1000) {
                    silentBackgroundSync();
                }
            }
        });

        // ── 수동 강제 새로고침 ──
        async function forceRefreshData() {
            const btn = document.getElementById('freshnessRefreshBtn');
            if (!btn) return;
            if (btn.disabled) return;

            btn.disabled = true;
            btn.innerHTML = '<span class="refresh-spin">🔄</span> 불러오는 중...';

            showSyncBadge('🔄 최신 데이터를 서버에서 직접 불러오는 중...', 'loading');

            try {
                // 캐시 바이패스를 위한 고유 타임스탬프 파라미터 추가
                const freshUrl = `${LIBRARY_DATA_API}?_t=${Date.now()}`;
                const res = await fetch(freshUrl);
                if (!res.ok) throw new Error(`서버 응답 오류: ${res.status}`);
                
                const payload = await res.json();
                const rawFetched = Array.isArray(payload.lectures) ? payload.lectures : [];
                const fetchedLectures = rawFetched.filter(d => !isWholeSetLoan(d));

                if (fetchedLectures.length > 0) {
                    libraryData = fetchedLectures;

                    libraryData.forEach(d => { updateLectureState(d); });

                    datasetMeta = payload.meta || datasetMeta;

                    const newInsts = Array.isArray(payload.institutions)
                        ? payload.institutions
                        : fetchedLectures.map(d => d.institution).filter(Boolean);
                    
                    institutionNames.clear();
                    newInsts.forEach(inst => institutionNames.add(inst));

                    const currentSelected = institutionSelect.value;
                    populateInstitutionSelect();
                    if (currentSelected && [...institutionNames].includes(currentSelected)) {
                        institutionSelect.value = currentSelected;
                    }

                    const generatedAtMs = payload.meta && payload.meta.generatedAt
                        ? (isNaN(payload.meta.generatedAt) ? Date.parse(payload.meta.generatedAt) : Number(payload.meta.generatedAt))
                        : Date.now();
                    saveCacheToLocalStorage(libraryData, datasetMeta, institutionNames, generatedAtMs);

                    allData = getSearchBaseData();
                    updateFilterButtons(getFilterCounts(allData));
                    renderResults();

                    showSyncBadge('✅ 최신 데이터 불러오기 완료!', 'success');
                } else {
                    showSyncBadge('⚠️ 서버에서 데이터를 받지 못했습니다', 'error');
                }
            } catch (err) {
                console.error('강제 새로고침 실패:', err);
                showSyncBadge('⚠️ 최신 데이터 불러오기 실패', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔄 최신 데이터 불러오기';
                updateFreshnessBar();
            }
        }

        // ── Worker 캐시에서 최근 도서관 데이터셋 가져오기 ──
        async function ensureLibraryDataLoaded() {
            if (dataLoadDone) return;
            if (isLoading) return;

            // 실시간 담당자 정보 동시 조회
            await loadAssigneeData();

            // 1단계: 동기적으로 localStorage 캐시 우선 로드 (즉각적인 화면 복구)
            const cached = loadCacheFromLocalStorage();
            let hasCache = false;

            if (cached && Array.isArray(cached.lectures) && cached.lectures.length > 0) {
                // 기존 캐시에 있는 전질 대출 / 전질대출 강좌 사전 배제
                libraryData = cached.lectures.filter(d => !isWholeSetLoan(d));
                datasetMeta = cached.meta;
                cached.institutions.forEach(inst => institutionNames.add(inst));
                
                // 오늘/내일 여부 실시간 업데이트
                libraryData.forEach(d => {
                    updateLectureState(d);
                });
                
                populateInstitutionSelect();
                hasCache = true;
            }

            const now = Date.now();
            const lastSyncTime = cached ? cached.lastSyncTime : 0;
            const timeDiff = now - lastSyncTime;

            // 2단계: 캐시 유효기간(12시간) 확인 및 동기화 필요 여부 결정
            if (hasCache && timeDiff < SYNC_GRACE_PERIOD_MS) {
                dataLoadDone = true;
                updateFreshnessBar();
                return;
            }

            // 동기화 모드 결정
            let syncMode = 'full'; 
            let fetchUrl = LIBRARY_DATA_API;
            let syncMessage = '🔄 전체 강좌 데이터 실시간 동기화 중...';

            if (hasCache) {
                if (timeDiff < SYNC_TIER_1_MS) {
                    syncMode = 'tier1';
                    fetchUrl = `${LIBRARY_DATA_API}?limit=100`;
                    syncMessage = '🔄 실시간 신청 인원 정보 갱신 중...';
                } else if (timeDiff < SYNC_TIER_2_MS) {
                    syncMode = 'tier2';
                    fetchUrl = `${LIBRARY_DATA_API}?limit=500`;
                    syncMessage = '🔄 최근 강좌 정보 실시간 동기화 중...';
                }
            } else {
                // [시크릿 모드/신규 기기 대책] 캐시가 완전히 없는 최초 접속 시에는
                // 전체 데이터 대신, 극단적으로 빠른 1단계 최근 100개 데이터 선로드 수행 (0.3~0.5초 완료)
                syncMode = 'firstPhase';
                fetchUrl = `${LIBRARY_DATA_API}?limit=100`;
                syncMessage = '🏛️ 최근 강좌 데이터 고속 로드 중...';
            }

            isLoading = true;

            if (abortController) abortController.abort();
            abortController = new AbortController();

            const contentEl = document.getElementById('content');
            
            // 캐시가 없는 최초 진입일 때는 화면 차단 로딩바와 멋진 스켈레톤 카드 사용
            if (!hasCache) {
                const savedInst = localStorage.getItem('selectedInstitution') || '';
                const loadingText = savedInst 
                    ? `🏛️ <strong>${escapeHtml(savedInst)}</strong> 강좌 목록을 신속하게 불러오는 중입니다...`
                    : '🏛️ 최근 화성시 도서관 강좌 목록을 가져오는 중입니다...';

                let skeletonCardsHtml = '';
                for (let i = 0; i < 6; i++) {
                    skeletonCardsHtml += `
                        <div class="skeleton-card">
                            <div>
                                <div class="skeleton-line badge"></div>
                                <div class="skeleton-line inst"></div>
                                <div class="skeleton-line title"></div>
                                <div class="skeleton-line desc"></div>
                                <div class="skeleton-line desc-short"></div>
                            </div>
                            <div class="skeleton-line footer"></div>
                        </div>`;
                }

                contentEl.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p style="margin-bottom: 2rem;">${loadingText}</p>
                        <div class="skeleton-grid">
                            ${skeletonCardsHtml}
                        </div>
                    </div>`;
            } else {
                // 기존 캐시가 있을 때는 백그라운드로 실행하고 고급 플로팅 배지 노출
                showSyncBadge(syncMessage, 'loading');
            }

            try {
                const res = await fetch(fetchUrl, { signal: abortController.signal });
                if (!res.ok) {
                    throw new Error(`동기화 API 응답 오류: ${res.status}`);
                }
                const payload = await res.json();
                const rawFetched = Array.isArray(payload.lectures) ? payload.lectures : [];
                const fetchedLectures = rawFetched.filter(d => !isWholeSetLoan(d));

                if (syncMode === 'full' || syncMode === 'firstPhase') {
                    libraryData = fetchedLectures;
                } else {
                    libraryData = mergeLectures(libraryData, fetchedLectures);
                }

                // 오늘/내일 강좌 상태 갱신
                libraryData.forEach(d => {
                    updateLectureState(d);
                });

                datasetMeta = payload.meta || datasetMeta;
                
                const newInsts = Array.isArray(payload.institutions)
                    ? payload.institutions
                    : fetchedLectures.map(d => d.institution).filter(Boolean);
                
                // 새 도서관이 동적으로 추가될 수 있으므로 기존 베이스라인에 안전하게 누적 병합
                newInsts.forEach(inst => institutionNames.add(inst));

                populateInstitutionSelect();

                // 3단계: 캐시 보존 및 타임스탬프 갱신
                // 1단계 고속 선로드일 때는 타임스탬프를 0으로 캐싱하여 2단계 전체 로드가 완전히 채워지기 전 브라우저를 새로고침하면 다시 선로드를 하도록 조절
                const generatedAtMs = payload.meta && payload.meta.generatedAt
                    ? (isNaN(payload.meta.generatedAt) ? Date.parse(payload.meta.generatedAt) : Number(payload.meta.generatedAt))
                    : now;
                saveCacheToLocalStorage(libraryData, datasetMeta, institutionNames, syncMode === 'firstPhase' ? 0 : generatedAtMs);

                if (hasCache) {
                    showSyncBadge('✅ 강좌 데이터 동기화 완료!', 'success');
                    // 현재 검색 및 필터 조건 갱신 및 리렌더링
                    allData = getSearchBaseData();
                    updateFilterButtons(getFilterCounts(allData));
                    renderResults();
                }
                
                dataLoadDone = true;
                updateFreshnessBar();

                // 1단계 고속 선로딩이 끝나면 화면을 차단하지 않고, 백그라운드에서 2단계 전체 데이터 동기화 실행
                if (syncMode === 'firstPhase') {
                    isBackgroundSyncing = true;
                    setTimeout(() => {
                        isBackgroundSyncing = false;
                        triggerFullSyncBackground();
                    }, 300);
                }
            } catch (e) {
                if (e.name === 'AbortError') { 
                    isLoading = false; 
                    return; 
                }
                
                console.error('동기화 실패:', e);

                if (hasCache) {
                    // 캐시가 존재할 때 통신 에러가 나면, 캐시 데이터로 백오프 작동 (오프라인 모드 배지 팝업)
                    showSyncBadge('⚠️ 업데이트 실패 (기존 캐시 사용)', 'error');
                    dataLoadDone = true;
                    updateFreshnessBar();
                } else {
                    contentEl.innerHTML = `<div class="error-msg"><h3>데이터를 불러오지 못했습니다</h3><p>${e.message}</p></div>`;
                    isLoading = false;
                    throw e;
                }
            }

            isLoading = false;
        }

        // ── 2단계 백그라운드 전체 데이터 동기화 ──
        async function triggerFullSyncBackground() {
            if (isBackgroundSyncing) return;
            isBackgroundSyncing = true;

            showSyncBadge('🔄 전체 강좌 데이터 실시간 동기화 중...', 'loading');

            try {
                const res = await fetch(LIBRARY_DATA_API);
                if (!res.ok) {
                    throw new Error(`백그라운드 동기화 API 응답 오류: ${res.status}`);
                }
                const payload = await res.json();
                const rawFetched = Array.isArray(payload.lectures) ? payload.lectures : [];
                const fetchedLectures = rawFetched.filter(d => !isWholeSetLoan(d));

                if (fetchedLectures.length > 0) {
                    libraryData = fetchedLectures;

                    // 오늘/내일 강좌 상태 갱신
                    libraryData.forEach(d => {
                        updateLectureState(d);
                    });

                    datasetMeta = payload.meta || datasetMeta;

                    const newInsts = Array.isArray(payload.institutions)
                        ? payload.institutions
                        : fetchedLectures.map(d => d.institution).filter(Boolean);
                    
                    // 새 도서관이 동적으로 추가될 수 있으므로 베이스라인에 누적 병합
                    newInsts.forEach(inst => institutionNames.add(inst));

                    // 사용자가 선택해놓은 도서관 옵션을 기억하고 Select 박스를 온전히 최신화
                    const currentSelected = institutionSelect.value;
                    populateInstitutionSelect();
                    if (currentSelected && [...institutionNames].includes(currentSelected)) {
                        institutionSelect.value = currentSelected;
                    }

                    // 정규 캐시 데이터 타임스탬프 저장
                    const generatedAtMs = payload.meta && payload.meta.generatedAt
                        ? (isNaN(payload.meta.generatedAt) ? Date.parse(payload.meta.generatedAt) : Number(payload.meta.generatedAt))
                        : Date.now();
                    saveCacheToLocalStorage(libraryData, datasetMeta, institutionNames, generatedAtMs);

                    // 사용자가 이미 검색 버튼을 눌렀거나, 도서관 필터가 선택되어 있는 경우 물 흐르듯 화면을 갱신
                    if (searchDone || institutionSelect.value) {
                        allData = getSearchBaseData();
                        updateFilterButtons(getFilterCounts(allData));
                        renderResults();
                    } else {
                        allData = getSearchBaseData();
                    }

                    showSyncBadge('✅ 전체 강좌 동기화 완료!', 'success');
                    updateFreshnessBar();
                }
            } catch (err) {
                console.error('백그라운드 전체 동기화 실패:', err);
                showSyncBadge('⚠️ 전체 강좌 동기화 실패 (1단계 데이터 유지)', 'error');
            } finally {
                isBackgroundSyncing = false;
            }
        }

        // ── 검색 시작 ──
        async function doSearch() {
            const keyword = searchInput.value.trim();
            if (isLoading) return;

            // 상태 초기화
            clearDateStateSilent();
            currentKeyword = keyword;
            allData = [];
            displayPage = 1;
            searchDone = true;
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');

            document.getElementById('searchBtn').disabled = true;

            try {
                await ensureLibraryDataLoaded();
                allData = getSearchBaseData();
            } catch (e) {
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = `<div class="error-msg"><h3>데이터를 불러오지 못했습니다</h3><p>${e.message}</p></div>`;
                document.getElementById('searchBtn').disabled = false;
                return;
            }

            document.getElementById('searchBtn').disabled = false;

            updateFilterButtons(getFilterCounts(allData));

            if (allData.length === 0) {
                const contentEl = document.getElementById('content');
                if (isBackgroundSyncing) {
                    // 백그라운드 전체 동기화가 진행 중일 때는 검색 결과 없음 대신 멋진 스피너와 로딩 상태 표시
                    contentEl.innerHTML = `
                        <div class="loading">
                            <div class="spinner"></div>
                            <p style="margin-top: 1.5rem; color: #718096; font-size: 0.93rem; font-weight: 500; line-height: 1.6;">
                                🔄 전체 강좌 데이터를 실시간으로 가져오는 중입니다...<br>
                                <span style="font-size: 0.82rem; color: #a0aec0; font-weight: 400; margin-top: 0.5rem; display: inline-block;">
                                    선택하신 도서관의 전체 강좌 목록을 빠르게 준비하고 있습니다. 잠시만 기다려 주세요!
                                </span>
                            </p>
                        </div>`;
                    return;
                }

                contentEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">&#128533;</div>
                        <h3>검색 결과가 없습니다</h3>
                        <p>도서관 선택이나 검색어를 바꿔 보세요</p>
