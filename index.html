<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화성시 도서관 강좌 검색</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f8fb;
            color: #1a202c;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #2f7e8b, #6f70c7);
            color: white;
            padding: 2.5rem 1rem 3.5rem;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.85;
        }

        .search-container {
            max-width: 860px;
            margin: -2rem auto 0;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: rgba(255,255,255,0.96);
            border-radius: 18px;
            box-shadow: 0 12px 34px rgba(43, 70, 96, 0.14);
            padding: 1.5rem;
            border: 1px solid rgba(226,232,240,0.9);
        }

        .search-row {
            display: grid;
            grid-template-columns: minmax(220px, 0.85fr) minmax(260px, 1.15fr) auto;
            gap: 0.75rem;
            align-items: center;
        }

        .search-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .search-field label {
            color: #718096;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .search-box input[type="text"],
        .search-box select {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
            color: #1a202c;
        }

        .search-box input[type="text"]:focus,
        .search-box select:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99,179,237,0.18);
        }

        .search-box button {
            padding: 0.85rem 1.8rem;
            background: linear-gradient(135deg, #38a3a5, #7b78d4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .search-box button:hover { opacity: 0.9; }
        .search-box button:active { transform: scale(0.97); }
        .search-box button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .filter-row {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.18rem 0.45rem;
            border: 1px solid transparent;
            border-radius: 999px;
            background: #edf7fb;
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
            color: #35505c;
        }

        .filter-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(90, 110, 130, 0.12);
        }
        .filter-btn.active {
            color: #1a202c;
            border-color: rgba(45,55,72,0.16);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.75), 0 7px 18px rgba(90,110,130,0.13);
        }

        .filter-btn.all { background: #eef2ff; color: #4c51bf; }
        .filter-btn.today { background: #eaffd2; color: #276749; border-color: #b8f26a; }
        .filter-btn.open { background: #dffaf0; color: #276749; }
        .filter-btn.upcoming { background: #e1f0ff; color: #2b6cb0; }
        .filter-btn.closed { background: #ffe8e8; color: #9b2c2c; }
        .filter-btn.ended { background: #edf2f7; color: #4a5568; }

        .main-content {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem 3rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .result-count {
            font-size: 0.95rem;
            color: #718096;
        }

        .result-count strong {
            color: #2b6cb0;
            font-size: 1.1rem;
        }

        .sort-select {
            padding: 0.4rem 0.8rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background: white;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 1rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #4c51bf;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading p {
            color: #718096;
            font-size: 0.95rem;
        }

        .progress-bar-container {
            max-width: 300px;
            margin: 0.75rem auto 0;
            background: #e2e8f0;
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4c51bf, #2b6cb0);
            border-radius: 8px;
            transition: width 0.3s;
            width: 0%;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: #a0aec0;
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { font-size: 1.15rem; color: #718096; margin-bottom: 0.5rem; }
        .empty-state p { font-size: 0.9rem; }

        /* Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
            padding: 1.3rem;
            transition: transform 0.16s ease, border-color 0.16s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
            contain: content;
        }

        .card:hover {
            border-color: #bee3f8;
            transform: translateY(-2px);
        }

        .card.status-open { border-left: 4px solid #9ae6b4; }
        .card.status-upcoming { border-left: 4px solid #90cdf4; }
        .card.status-closed { border-left: 4px solid #feb2b2; }
        .card.status-ended { border-left: 4px solid #cbd5e0; }

        .card.today-card {
            border-color: #c6f970;
            border-left-color: #b8f26a;
            box-shadow: 0 0 0 1px rgba(190,242,100,0.55), 0 0 28px rgba(190,242,100,0.48);
        }

        .card-status {
            position: absolute;
            top: 0;
            right: 0;
            padding: 0.35rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0 14px 0 10px;
        }

        .card-status.open { background: #c6f6d5; color: #22543d; }
        .card-status.upcoming { background: #bee3f8; color: #2a4365; }
        .card-status.closed { background: #fed7d7; color: #742a2a; }
        .card-status.ended { background: #e2e8f0; color: #4a5568; }

        .today-badge {
            align-self: flex-start;
            padding: 0.24rem 0.62rem;
            border-radius: 999px;
            background: #dfff8f;
            color: #22543d;
            border: 1px solid #b8f26a;
            box-shadow: 0 0 16px rgba(190,242,100,0.8);
            font-size: 0.74rem;
            font-weight: 700;
            margin-bottom: 0.45rem;
        }

        .card-institution {
            font-size: 0.78rem;
            color: #4c51bf;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .card-title {
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 0.7rem;
            padding-right: 3rem;
            color: #1a202c;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.8rem;
            flex: 1;
        }

        .card-info-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #4a5568;
        }

        .card-info-item .label {
            min-width: 48px;
            font-weight: 600;
            color: #718096;
            flex-shrink: 0;
        }

        .card-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .tag {
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag-target { background: #ebf4ff; color: #2b6cb0; }
        .tag-free { background: #f0fff4; color: #276749; }
        .tag-paid { background: #fffaf0; color: #c05621; }
        .tag-class { background: #faf5ff; color: #6b46c1; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.7rem;
            border-top: 1px solid #f0f4f8;
        }

        .card-apply {
            font-size: 0.8rem;
            color: #718096;
        }

        .card-apply strong { color: #2b6cb0; }

        .card-link {
            padding: 0.4rem 0.9rem;
            background: #ebf4ff;
            color: #2b6cb0;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .card-link:hover { background: #bee3f8; }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .page-btn {
            padding: 0.5rem 0.85rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s;
            color: #4a5568;
        }

        .page-btn:hover { border-color: #4c51bf; color: #4c51bf; }
        .page-btn.active {
            background: #4c51bf;
            color: white;
            border-color: #4c51bf;
        }
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.btn-next {
            background: #ebf4ff;
            color: #2b6cb0;
            border-color: #bee3f8;
            font-weight: 600;
        }
        .page-btn.btn-next:hover { background: #bee3f8; }

        .page-btn.btn-all {
            background: linear-gradient(135deg, #4c51bf, #2b6cb0);
            color: white;
            border-color: #4c51bf;
            font-weight: 600;
        }
        .page-btn.btn-all:hover { opacity: 0.9; }

        .page-separator {
            padding: 0.5rem 0.3rem;
            color: #a0aec0;
            font-size: 0.85rem;
        }

        .loading-more {
            text-align: center;
            padding: 1.5rem;
            color: #718096;
            font-size: 0.9rem;
        }

        .loading-more .spinner-sm {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #4c51bf;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        /* Error */
        .error-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: #e53e3e;
        }

        .error-msg h3 { margin-bottom: 0.5rem; }

        @media (max-width: 640px) {
            header h1 { font-size: 1.4rem; }
            .search-row { grid-template-columns: 1fr; }
            .card-grid { grid-template-columns: 1fr; }
            .card-title { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>화성시 도서관 강좌 검색</h1>
        <p>화성시통합예약시스템 OpenAPI 기반 강좌/교육 프로그램 검색</p>
    </header>

    <div class="search-container">
        <div class="search-box">
            <div class="search-row">
                <div class="search-field">
                    <label for="institutionSelect">기관</label>
                    <select id="institutionSelect">
                        <option value="">전체 도서관</option>
                    </select>
                </div>
                <div class="search-field">
                    <label for="searchInput">검색어</label>
                    <input type="text" id="searchInput" placeholder="강좌명, 무료, 그림, 대상, 장소 등" autocomplete="off">
                </div>
                <button id="searchBtn" onclick="doSearch()">검색</button>
            </div>
            <div class="filter-row">
                <button class="filter-btn all active" data-filter="all" onclick="setFilter('all', this)">전체(0)</button>
                <button class="filter-btn today" data-filter="today" onclick="setFilter('today', this)">오늘수업(0)</button>
                <button class="filter-btn open" data-filter="접수중" onclick="setFilter('접수중', this)">접수중(0)</button>
                <button class="filter-btn upcoming" data-filter="접수예정" onclick="setFilter('접수예정', this)">접수예정(0)</button>
                <button class="filter-btn closed" data-filter="접수마감" onclick="setFilter('접수마감', this)">접수마감(0)</button>
                <button class="filter-btn ended" data-filter="강좌종료" onclick="setFilter('강좌종료', this)">강좌종료(0)</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="content">
            <div class="empty-state">
                <div class="icon">&#128218;</div>
                <h3>도서관을 선택하거나 검색어를 입력해 보세요</h3>
                <p>강좌명, 대상, 장소, 무료 여부까지 한 번에 검색할 수 있습니다</p>
            </div>
        </div>
    </div>

    <script>
        // ── 프록시 설정 ──────────────────────────────────────────────
        // Cloudflare Worker URL을 배포한 뒤 아래 값을 교체하세요.
        // 예) 'https://liblect-proxy.YOUR-SUBDOMAIN.workers.dev'
        // 비워두면 로컬 서버(/api/)로 폴백합니다.
        const WORKER_BASE = 'https://liblect-proxy.jssimonlee.workers.dev/';

        const LIBRARY_DATA_API = WORKER_BASE
            ? WORKER_BASE.replace(/\/$/, '') + '/api/libraryLectures'
            : '/api/libraryLectures';
        // ────────────────────────────────────────────────────────────

        const CARDS_PER_PAGE = 12;   // 화면에 보여주는 카드 수

        // 상태 관리
        let libraryData = [];         // 최근 6개월 안의 도서관 데이터
        let allData = [];             // 현재 검색어에 매칭된 데이터
        let currentFilter = 'all';
        let displayPage = 1;          // 현재 보고 있는 표시 페이지
        let searchDone = true;        // 현재 데이터셋 안에서 검색이 끝났는지
        let dataLoadDone = false;     // 최근 도서관 데이터셋을 만들었는지
        let isLoading = false;
        let currentKeyword = '';
        let institutionNames = new Set();
        let datasetMeta = null;
        let abortController = null;

        const searchInput = document.getElementById('searchInput');
        const institutionSelect = document.getElementById('institutionSelect');

        // Enter key
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        institutionSelect.addEventListener('change', () => {
            const val = institutionSelect.value;
            if (val) {
                localStorage.setItem('selectedInstitution', val);
            } else {
                localStorage.removeItem('selectedInstitution');
            }
            doSearch();
        });
        initializeApp();

        // ── Worker 캐시에서 최근 도서관 데이터셋 가져오기 ──
        async function ensureLibraryDataLoaded() {
            if (dataLoadDone || isLoading) return;
            isLoading = true;

            if (abortController) abortController.abort();
            abortController = new AbortController();

            const contentEl = document.getElementById('content');
            contentEl.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>최근 도서관 강좌 캐시를 불러오는 중...</p>
                </div>`;

            try {
                const res = await fetch(LIBRARY_DATA_API, { signal: abortController.signal });
                if (!res.ok) {
                    throw new Error(`Worker 응답 오류: ${res.status}`);
                }
                const payload = await res.json();
                libraryData = Array.isArray(payload.lectures) ? payload.lectures : [];
                datasetMeta = payload.meta || null;
                institutionNames = new Set(Array.isArray(payload.institutions)
                    ? payload.institutions
                    : libraryData.map(d => d.institution).filter(Boolean));
                populateInstitutionSelect();
            } catch (e) {
                if (e.name === 'AbortError') { isLoading = false; return; }
                contentEl.innerHTML = `<div class="error-msg"><h3>데이터를 불러오지 못했습니다</h3><p>${e.message}</p></div>`;
                isLoading = false;
                throw e;
            }

            dataLoadDone = true;
            isLoading = false;
        }

        // ── 검색 시작 ──
        async function doSearch() {
            const keyword = searchInput.value.trim();
            if (isLoading) return;

            // 상태 초기화
            currentKeyword = keyword;
            allData = [];
            displayPage = 1;
            searchDone = true;
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');

            document.getElementById('searchBtn').disabled = true;

            try {
                await ensureLibraryDataLoaded();
                allData = getSearchBaseData();
            } catch (e) {
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = `<div class="error-msg"><h3>데이터를 불러오지 못했습니다</h3><p>${e.message}</p></div>`;
                document.getElementById('searchBtn').disabled = false;
                return;
            }

            document.getElementById('searchBtn').disabled = false;

            updateFilterButtons(getFilterCounts(allData));

            if (allData.length === 0) {
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">&#128533;</div>
                        <h3>검색 결과가 없습니다</h3>
                        <p>도서관 선택이나 검색어를 바꿔 보세요</p>
                    </div>`;
                return;
            }

            renderResults();
        }

        // ── "다음" 버튼: 다음 12개 불러오기 ──
        async function loadNextPage() {
            const filtered = getFilteredData();
            const maxPage = Math.ceil(filtered.length / CARDS_PER_PAGE);
            if (displayPage < maxPage) {
                displayPage++;
            }

            renderResults();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        // ── "전체" 버튼 ──
        async function loadAll() {
            displayPage = 1;
            renderResults();
        }

        // ── 필터 ──
        async function setFilter(filter, btn) {
            currentFilter = filter;
            displayPage = 1;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderResults();
        }

        function getFilteredData() {
            let data = [...allData];
            if (currentFilter === 'today') {
                data = data.filter(d => d.isToday);
            } else if (currentFilter !== 'all') {
                data = data.filter(d => d.status === currentFilter);
            }
            data.sort((a, b) => {
                if (currentFilter === 'today') {
                    return (a.beginTime || '').localeCompare(b.beginTime || '');
                }
                return (b.beginDate || '').localeCompare(a.beginDate || '');
            });
            return data;
        }

        // ── 렌더링 ──
        function renderResults() {
            const contentEl = document.getElementById('content');
            const filtered = getFilteredData();
            const totalFiltered = filtered.length;
            const totalPages = Math.ceil(totalFiltered / CARDS_PER_PAGE);
            const start = (displayPage - 1) * CARDS_PER_PAGE;
            const pageData = filtered.slice(start, start + CARDS_PER_PAGE);

            const hasNextPageData = displayPage < totalPages;

            const counts = getFilterCounts(allData);
            updateFilterButtons(counts);

            let html = `
                <div class="status-bar">
                    <div class="result-count">
                        현재 <strong>${allData.length}</strong>건 발견
                        ${currentFilter !== 'all' ? ` &middot; "${getFilterLabel(currentFilter)}" <strong>${totalFiltered}</strong>건` : ''}
                        ${getSearchSummary()}
                    </div>
                </div>
                <div class="card-grid">`;

            pageData.forEach(d => {
                html += renderCard(d);
            });

            html += '</div>';

            // ── 하단: 페이지 번호 + 다음 + 전체 버튼 ──
            html += '<div class="pagination">';

            // 이전 버튼
            if (displayPage > 1) {
                html += `<button class="page-btn" onclick="goPage(${displayPage - 1})">이전</button>`;
            }

            // 페이지 번호들
            if (totalPages > 1) {
                const startP = Math.max(1, displayPage - 4);
                const endP = Math.min(totalPages, startP + 9);
                for (let i = startP; i <= endP; i++) {
                    html += `<button class="page-btn ${i === displayPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
                }
            }

            // 다음 버튼: 아직 더 불러올 데이터가 있으면 표시
            if (hasNextPageData || !searchDone) {
                html += `<button class="page-btn btn-next" onclick="loadNextPage()">다음 ></button>`;
            }

            // 전체 버튼: 아직 API를 끝까지 읽지 않았으면 표시
            if (!searchDone) {
                html += `<button class="page-btn btn-all" onclick="loadAll()">전체</button>`;
            }

            html += '</div>';

            contentEl.innerHTML = html;
        }

        function renderCard(d) {
            return `
                <div class="card status-${getStatusClass(d.status)} ${d.isToday ? 'today-card' : ''}">
                    ${d.isToday ? '<div class="today-badge">오늘수업</div>' : ''}
                    <div class="card-status ${getStatusClass(d.status)}">${d.status}</div>
                    <div class="card-institution">${d.institution}</div>
                    <div class="card-title">${escapeHtml(d.name)}</div>
                    <div class="card-info">
                        <div class="card-info-item">
                            <span class="label">기간</span>
                            <span>${d.beginDate} ~ ${d.endDate}</span>
                        </div>
                        <div class="card-info-item">
                            <span class="label">시간</span>
                            <span>${d.beginTime} ~ ${d.endTime} (${getDayNames(d.dayOfWeek)})</span>
                        </div>
                        <div class="card-info-item">
                            <span class="label">장소</span>
                            <span>${escapeHtml(d.place)}</span>
                        </div>
                        ${d.applyBegin ? `<div class="card-info-item">
                            <span class="label">접수</span>
                            <span>${d.applyBegin} ~ ${d.applyEnd}</span>
                        </div>` : ''}
                        ${d.reference ? `<div class="card-info-item">
                            <span class="label">문의</span>
                            <span>${d.reference}</span>
                        </div>` : ''}
                    </div>
                    <div class="card-tags">
                        ${d.targetNm ? `<span class="tag tag-target">${d.targetNm}${d.targetDetail ? ' / ' + escapeHtml(d.targetDetail) : ''}</span>` : ''}
                        <span class="tag ${d.price === 0 ? 'tag-free' : 'tag-paid'}">${d.freeNm || (d.price === 0 ? '무료' : d.price.toLocaleString() + '원')}</span>
                        ${d.classNm ? `<span class="tag tag-class">${d.classNm}</span>` : ''}
                    </div>
                    <div class="card-footer">
                        <div class="card-apply">
                            신청 <strong>${d.applyUserNum}</strong>/${d.applyLimitNum}명
                            ${parseInt(d.waitLimitNum) > 0 ? ` &middot; 대기 ${d.waitUserNum}/${d.waitLimitNum}명` : ''}
                        </div>
                        ${d.detailUrl ? `<a class="card-link" href="${d.detailUrl}" target="_blank">상세보기</a>` : ''}
                    </div>
                </div>`;
        }

        function goPage(page) {
            displayPage = page;
            renderResults();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        function getDayNames(dayStr) {
            const map = { '1': '월', '2': '화', '3': '수', '4': '목', '5': '금', '6': '토', '7': '일' };
            if (!dayStr) return '';
            return dayStr.split(',').map(d => map[d.trim()] || d.trim()).join(', ');
        }

        function getFilterLabel(filter) {
            return filter === 'today' ? '오늘수업' : filter;
        }

        function populateInstitutionSelect() {
            const saved = localStorage.getItem('selectedInstitution');
            const selected = institutionSelect.value || saved;
            const selectableNames = [...institutionNames].filter(name => name.includes('도서관'));
            const options = ['<option value="">전체 도서관</option>']
                .concat(selectableNames.map(name =>
                    `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`
                ));
            institutionSelect.innerHTML = options.join('');
            if (selectableNames.includes(selected)) {
                institutionSelect.value = selected;
            }
        }

        function getSearchBaseData() {
            const selectedInstitution = institutionSelect.value;
            const keyword = currentKeyword.toLowerCase();
            return libraryData.filter(d => {
                if (selectedInstitution && d.institution !== selectedInstitution) return false;
                if (!keyword) return true;
                return getSearchBlob(d).includes(keyword);
            });
        }

        function getSearchBlob(d) {
            return Object.values(d)
                .filter(value => value !== null && value !== undefined)
                .map(value => String(value))
                .join(' ')
                .toLowerCase();
        }

        function getFilterCounts(data) {
            const counts = {
                all: data.length,
                today: 0,
                '접수중': 0,
                '접수예정': 0,
                '접수마감': 0,
                '강좌종료': 0,
            };
            data.forEach(d => {
                if (d.isToday) counts.today++;
                if (Object.prototype.hasOwnProperty.call(counts, d.status)) {
                    counts[d.status]++;
                }
            });
            return counts;
        }

        function updateFilterButtons(counts) {
            const labels = {
                all: '전체',
                today: '오늘수업',
                '접수중': '접수중',
                '접수예정': '접수예정',
                '접수마감': '접수마감',
                '강좌종료': '강좌종료',
            };
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const filter = btn.dataset.filter;
                btn.textContent = `${labels[filter] || filter}(${counts[filter] || 0})`;
            });
        }

        function getSearchSummary() {
            const parts = [];
            if (institutionSelect.value) parts.push(`기관: ${escapeHtml(institutionSelect.value)}`);
            if (currentKeyword) parts.push(`검색어: ${escapeHtml(currentKeyword)}`);
            return parts.length ? ` &middot; ${parts.join(' · ')}` : '';
        }

        async function initializeApp() {
            document.getElementById('searchBtn').disabled = true;
            try {
                await ensureLibraryDataLoaded();
                if (institutionSelect.value) {
                    doSearch();
                } else {
                    allData = [...libraryData];
                    updateFilterButtons(getFilterCounts(libraryData));
                    document.getElementById('content').innerHTML = `
                        <div class="empty-state">
                            <div class="icon">&#128218;</div>
                            <h3>도서관을 선택하거나 검색어를 입력해 보세요</h3>
                            <p>강좌명, 대상, 장소, 무료 여부까지 한 번에 검색할 수 있습니다</p>
                        </div>`;
                }
            } catch (e) {
                // ensureLibraryDataLoaded에서 오류 화면을 표시합니다.
            }
            document.getElementById('searchBtn').disabled = false;
        }

        function getStatusClass(status) {
            if (status === '접수중') return 'open';
            if (status === '접수예정') return 'upcoming';
            if (status === '접수마감') return 'closed';
            return 'ended';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
