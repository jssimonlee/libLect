<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>화성시 도서관 강좌 검색</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f8fb;
            color: #1a202c;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #2f7e8b, #6f70c7);
            color: white;
            padding: 2.5rem 1rem 3.5rem;
            text-align: center;
        }


        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 0.76rem;
            opacity: 0.85;
        }

        .search-container {
            max-width: 860px;
            margin: -2rem auto 0;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .search-box {
            background: rgba(255,255,255,0.96);
            border-radius: 18px;
            box-shadow: 0 12px 34px rgba(43, 70, 96, 0.14);
            padding: 1.5rem;
            border: 1px solid rgba(226,232,240,0.9);
        }

        .search-row {
            display: grid;
            grid-template-columns: minmax(220px, 0.85fr) minmax(260px, 1.15fr) auto;
            gap: 0.75rem;
            align-items: center;
        }

        .search-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .search-field label {
            color: #718096;
            font-size: 0.76rem;
            font-weight: 700;
        }

        .search-box input[type="text"],
        .search-box select {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: #fff;
            color: #1a202c;
        }

        .search-box input[type="text"]:focus,
        .search-box select:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99,179,237,0.18);
        }

        #searchBtn {
            padding: 0.85rem 1.8rem;
            background: linear-gradient(135deg, #38a3a5, #7b78d4);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.11s;
            white-space: nowrap;
            align-self: end;
            height: 47px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        #searchBtn:hover { opacity: 0.9; }
        #searchBtn:active { transform: scale(0.97); }
        #searchBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .filter-row {
            display: flex;
            gap: 0.35rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.22rem 0.54rem;
            border: 1px solid transparent;
            border-radius: 999px;
            background: #edf7fb;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
            color: #35505c;
        }

        .filter-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(90, 110, 130, 0.12);
        }
        .filter-btn.active {
            font-weight: 800;
            z-index: 2;
            animation: filterBtnActivePulse 1.6s infinite ease-in-out;
        }

        @keyframes filterBtnActivePulse {
            0% {
                transform: scale(1.02) translateY(-1px);
                box-shadow: inset 0 0 0 1.5px currentColor, 0 4px 8px rgba(0, 0, 0, 0.08), 0 0 0 0px currentColor;
            }
            50% {
                transform: scale(1.08) translateY(-2px);
                box-shadow: inset 0 0 0 1.5px currentColor, 0 6px 12px rgba(0, 0, 0, 0.12), 0 0 10px 4px currentColor;
            }
            100% {
                transform: scale(1.02) translateY(-1px);
                box-shadow: inset 0 0 0 1.5px currentColor, 0 4px 8px rgba(0, 0, 0, 0.08), 0 0 0 0px currentColor;
            }
        }

        .clear-date-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 5px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.08);
            color: currentColor;
            font-size: 0.55rem;
            line-height: 1;
            cursor: pointer;
            transition: background 0.12s ease, color 0.12s ease;
            vertical-align: middle;
        }

        .clear-date-btn:hover {
            background: rgba(220, 38, 38, 0.15);
            color: #e53e3e !important;
        }

        .filter-btn.all { background: #eef2ff; color: #4c51bf; }
        .filter-btn.today { background: #eaffd2; color: #276749; border-color: #b8f26a; }
        .filter-btn.tomorrow { background: #fffbeb; color: #b45309; border-color: #fde68a; }
        .filter-btn.date-select { background: #f0fdf4; color: #166534; border-color: #bbf7d0; }
        .filter-btn.open { background: #dffaf0; color: #276749; }
        .filter-btn.upcoming { background: #e1f0ff; color: #2b6cb0; }
        .filter-btn.closed { background: #ffe8e8; color: #9b2c2c; }
        .filter-btn.ended { background: #edf2f7; color: #4a5568; }

        .main-content {
            max-width: 1100px;
            margin: 1.5rem auto;
            padding: 0 1rem 3rem;
        }

        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
            width: 100%;
        }

        .result-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: 0.45rem 1.2rem;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            border: 1px solid #e2e8f0;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(148, 163, 184, 0.05);
            font-size: 0.76rem;
            font-weight: 600;
            color: #4a5568;
            transition: all 0.2s ease-in-out;
        }

        .result-count:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(148, 163, 184, 0.1);
            border-color: #cbd5e0;
        }

        .count-segment {
            display: inline-flex;
            align-items: center;
        }

        .count-segment.total {
            color: #4a5568;
        }

        .count-segment strong {
            color: #3182ce;
            font-weight: 800;
            font-size: 0.82rem;
            margin-left: 0.15rem;
            margin-right: 0.15rem;
        }

        .count-segment.filter {
            color: #2b6cb0;
        }

        .count-segment.inst {
            color: #2c5282;
        }

        .count-segment.keyword {
            color: #4a5568;
            font-style: italic;
        }

        .count-divider {
            display: inline-block;
            width: 1px;
            height: 10px;
            background-color: #cbd5e0;
            margin: 0 0.6rem;
            align-self: center;
        }

        .sort-select {
            padding: 0.4rem 0.8rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            background: white;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 1rem;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top-color: #4c51bf;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading p {
            color: #718096;
            font-size: 0.95rem;
        }

        .progress-bar-container {
            max-width: 300px;
            margin: 0.75rem auto 0;
            background: #e2e8f0;
            border-radius: 8px;
            height: 6px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4c51bf, #2b6cb0);
            border-radius: 8px;
            transition: width 0.3s;
            width: 0%;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: #a0aec0;
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { font-size: 1.15rem; color: #718096; margin-bottom: 0.5rem; }
        .empty-state p { font-size: 0.9rem; }

        /* Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1rem;
        }

        .card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 1px 8px rgba(0,0,0,0.06);
            padding: 1.3rem;
            transition: transform 0.16s ease, border-color 0.16s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border: 1px solid transparent;
            contain: content;
        }

        .card:hover {
            border-color: #bee3f8;
            transform: translateY(-2px);
        }

        .card.status-open { border-left: 4px solid #9ae6b4; }
        .card.status-upcoming { border-left: 4px solid #90cdf4; }
        .card.status-closed { border-left: 4px solid #feb2b2; }
        .card.status-ended { border-left: 4px solid #cbd5e0; }

        @keyframes todayGlowPulse {
            0% {
                box-shadow: 0 0 0 1px rgba(190,242,100,0.55), 0 0 14px rgba(190,242,100,0.35);
            }
            50% {
                box-shadow: 0 0 0 3px rgba(190,242,100,0.7), 0 0 28px rgba(190,242,100,0.55);
            }
            100% {
                box-shadow: 0 0 0 1px rgba(190,242,100,0.55), 0 0 14px rgba(190,242,100,0.35);
            }
        }

        .card.today-card {
            border-color: #c6f970;
            border-left-color: #b8f26a;
            animation: todayGlowPulse 2.5s infinite ease-in-out;
        }

        .card.tomorrow-card {
            border-color: #fcd34d;
            border-left-color: #fbbf24;
            box-shadow: 0 0 0 1px rgba(251,191,36,0.3), 0 4px 16px rgba(251,191,36,0.15);
        }

        .card-status {
            position: absolute;
            top: 0;
            right: 0;
            padding: 0.35rem 0.9rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0 14px 0 10px;
        }

        .card-status.open { background: #c6f6d5; color: #22543d; }
        .card-status.upcoming { background: #bee3f8; color: #2a4365; }
        .card-status.closed { background: #fed7d7; color: #742a2a; }
        .card-status.ended { background: #e2e8f0; color: #4a5568; }

        .today-badge {
            align-self: flex-start;
            padding: 0.24rem 0.62rem;
            border-radius: 999px;
            background: #dfff8f;
            color: #22543d;
            border: 1px solid #b8f26a;
            box-shadow: 0 0 16px rgba(190,242,100,0.8);
            font-size: 0.74rem;
            font-weight: 700;
            margin-bottom: 0.45rem;
        }

        .tomorrow-badge {
            align-self: flex-start;
            padding: 0.24rem 0.62rem;
            border-radius: 999px;
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fcd34d;
            box-shadow: 0 0 12px rgba(251,191,36,0.25);
            font-size: 0.74rem;
            font-weight: 700;
            margin-bottom: 0.45rem;
        }

        .card-institution {
            font-size: 0.78rem;
            color: #4c51bf;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .card-title {
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.45;
            margin-bottom: 0.7rem;
            padding-right: 3rem;
            color: #1a202c;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            margin-bottom: 0.8rem;
            flex: 1;
        }

        .card-info-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: #4a5568;
        }

        .card-info-item .label {
            min-width: 48px;
            font-weight: 600;
            color: #718096;
            flex-shrink: 0;
        }

        .card-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.75rem;
        }

        .tag {
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .tag-target { background: #ebf4ff; color: #2b6cb0; }
        .tag-free { background: #f0fff4; color: #276749; }
        .tag-paid { background: #fffaf0; color: #c05621; }
        .tag-class { background: #faf5ff; color: #6b46c1; }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.7rem;
            border-top: 1px solid #f0f4f8;
        }

        .card-apply {
            font-size: 0.8rem;
            color: #718096;
        }

        .card-apply strong { color: #2b6cb0; }

        .card-link {
            padding: 0.4rem 0.9rem;
            background: #ebf4ff;
            color: #2b6cb0;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .card-link:hover { background: #bee3f8; }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 0.4rem;
            margin-top: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .page-btn {
            padding: 0.5rem 0.85rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s;
            color: #4a5568;
        }

        .page-btn:hover { border-color: #4c51bf; color: #4c51bf; }
        .page-btn.active {
            background: #4c51bf;
            color: white;
            border-color: #4c51bf;
        }
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .page-btn.btn-next {
            background: #ebf4ff;
            color: #2b6cb0;
            border-color: #bee3f8;
            font-weight: 600;
        }
        .page-btn.btn-next:hover { background: #bee3f8; }

        .page-btn.btn-all {
            background: linear-gradient(135deg, #4c51bf, #2b6cb0);
            color: white;
            border-color: #4c51bf;
            font-weight: 600;
        }
        .page-btn.btn-all:hover { opacity: 0.9; }

        .page-separator {
            padding: 0.5rem 0.3rem;
            color: #a0aec0;
            font-size: 0.85rem;
        }

        .loading-more {
            text-align: center;
            padding: 1.5rem;
            color: #718096;
            font-size: 0.9rem;
        }

        .loading-more .spinner-sm {
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #4c51bf;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        /* Error */
        .error-msg {
            text-align: center;
            padding: 3rem 1rem;
            color: #e53e3e;
        }

        .error-msg h3 { margin-bottom: 0.5rem; }

        /* 백그라운드 동기화 알림 배지 */
        .sync-badge {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            padding: 12px 20px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 30px -4px rgba(0, 0, 0, 0.3), 0 8px 16px -4px rgba(0, 0, 0, 0.2);
            z-index: 10000;
            transform: translateY(120px) scale(0.9);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
            pointer-events: none;
        }

        .sync-badge.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .sync-badge .spinner-mini {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .sync-badge.success {
            background: rgba(6, 78, 59, 0.9);
            border-color: rgba(52, 211, 153, 0.3);
            color: #a7f3d0;
        }

        .sync-badge.error {
            background: rgba(127, 29, 29, 0.9);
            border-color: rgba(248, 113, 113, 0.3);
            color: #fca5a5;
        }

        @media (max-width: 640px) {
            header h1 { font-size: 1.4rem; }
            .search-row { grid-template-columns: 1fr; }
            .card-grid { grid-template-columns: 1fr; }
            .card-title { font-size: 0.95rem; }
            .sync-badge {
                bottom: 16px;
                right: 16px;
                left: 16px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div id="syncBadge" class="sync-badge">
        <div class="spinner-mini"></div>
        <span id="syncBadgeText">데이터 동기화 중...</span>
    </div>
    <header>
        <h1>화성시 도서관 강좌 검색</h1>
        <p>화성시통합예약시스템 OpenAPI 기반 강좌/교육 프로그램 검색 (최근 6개월 강좌 대상)</p>
    </header>

    <div class="search-container">
        <div class="search-box">
            <div class="search-row">
                <div class="search-field">
                    <label for="institutionSelect">기관</label>
                    <select id="institutionSelect">
                        <option value="">전체 도서관</option>
                    </select>
                </div>
                <div class="search-field">
                    <label for="searchInput">검색어</label>
                    <input type="text" id="searchInput" placeholder="강좌명, 대상, 장소, 문의 등" autocomplete="off">
                </div>
                <button id="searchBtn" onclick="doSearch()">검색</button>
            </div>
            <div class="filter-row">
                <button class="filter-btn all active" data-filter="all" onclick="setFilter('all', this)">전체(0)</button>
                <button class="filter-btn today" data-filter="today" onclick="setFilter('today', this)">오늘수업(0)</button>
                <button class="filter-btn tomorrow" data-filter="tomorrow" onclick="setFilter('tomorrow', this)">내일수업(0)</button>
                <button class="filter-btn date-select" data-filter="date" onclick="openDatePicker(this)">📅 달력선택</button>
                <input type="date" id="filterDatePicker" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1px; height: 1px; opacity: 0; pointer-events: none; border: none; outline: none; padding: 0; margin: 0; z-index: -9999;" onchange="handleDateSelected(this.value)">
                <button class="filter-btn open" data-filter="접수중" onclick="setFilter('접수중', this)">접수중(0)</button>
                <button class="filter-btn upcoming" data-filter="접수예정" onclick="setFilter('접수예정', this)">접수예정(0)</button>
                <button class="filter-btn closed" data-filter="접수마감" onclick="setFilter('접수마감', this)">접수마감(0)</button>
                <button class="filter-btn ended" data-filter="강좌종료" onclick="setFilter('강좌종료', this)">강좌종료(0)</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div id="content">
            <div class="empty-state">
                <div class="icon">&#128218;</div>
                <h3>도서관을 선택하거나 검색어를 입력해 보세요</h3>
                <p>강좌명, 대상, 장소, 무료 여부까지 한 번에 검색할 수 있습니다</p>
            </div>
        </div>
    </div>

    <script>
        // ── 프록시 설정 ──────────────────────────────────────────────
        // Cloudflare Worker URL을 배포한 뒤 아래 값을 교체하세요.
        // 예) 'https://liblect-proxy.YOUR-SUBDOMAIN.workers.dev'
        // 비워두면 로컬 서버(/api/)로 폴백합니다.
        const WORKER_BASE = 'https://liblect-proxy.jssimonlee.workers.dev/';

        const LIBRARY_DATA_API = WORKER_BASE
            ? WORKER_BASE.replace(/\/$/, '') + '/api/libraryLectures'
            : '/api/libraryLectures';
        // ────────────────────────────────────────────────────────────

        const CARDS_PER_PAGE = 12;   // 화면에 보여주는 카드 수

        // 상태 관리
        let libraryData = [];         // 최근 6개월 안의 도서관 데이터
        let allData = [];             // 현재 검색어에 매칭된 데이터
        let currentFilter = 'all';
        let displayPage = 1;          // 현재 보고 있는 표시 페이지
        let searchDone = true;        // 현재 데이터셋 안에서 검색이 끝났는지
        let dataLoadDone = false;     // 최근 도서관 데이터셋을 만들었는지
        let isLoading = false;
        let currentKeyword = '';
        let institutionNames = new Set();
        let datasetMeta = null;
        let abortController = null;

        const searchInput = document.getElementById('searchInput');
        const institutionSelect = document.getElementById('institutionSelect');

        // Enter key
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        institutionSelect.addEventListener('change', () => {
            const val = institutionSelect.value;
            if (val) {
                localStorage.setItem('selectedInstitution', val);
            } else {
                localStorage.removeItem('selectedInstitution');
            }
            // Reset search input and keyword
            searchInput.value = '';
            currentKeyword = '';
            
            doSearch();
        });

        const keyToChosung = {
            'r': 'ㄱ', 's': 'ㄴ', 'e': 'ㄷ', 'f': 'ㄹ', 'a': 'ㅁ', 'q': 'ㅂ', 't': 'ㅅ', 
            'd': 'ㅇ', 'w': 'ㅈ', 'c': 'ㅊ', 'z': 'ㅋ', 'x': 'ㅌ', 'v': 'ㅍ', 'g': 'ㅎ',
            'ㄱ': 'ㄱ', 'ㄴ': 'ㄴ', 'ㄷ': 'ㄷ', 'ㄹ': 'ㄹ', 'ㅁ': 'ㅁ', 'ㅂ': 'ㅂ', 'ㅅ': 'ㅅ',
            'ㅇ': 'ㅇ', 'ㅈ': 'ㅈ', 'ㅊ': 'ㅊ', 'ㅋ': 'ㅋ', 'ㅌ': 'ㅌ', 'ㅍ': 'ㅍ', 'ㅎ': 'ㅎ'
        };

        function getChosung(str) {
            if (!str) return '';
            const char = str.charAt(0);
            const code = char.charCodeAt(0);
            if (code >= 0xAC00 && code <= 0xD7A3) {
                const chosungList = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
                return chosungList[Math.floor((code - 0xAC00) / 588)];
            }
            const singleConsonants = {
                0x3131: 'ㄱ', 0x3132: 'ㄲ', 0x3134: 'ㄴ', 0x3137: 'ㄷ', 0x3138: 'ㄸ', 
                0x3139: 'ㄹ', 0x3141: 'ㅁ', 0x3142: 'ㅂ', 0x3143: 'ㅃ', 0x3145: 'ㅅ', 
                0x3146: 'ㅆ', 0x3147: 'ㅇ', 0x3148: 'ㅈ', 0x3149: 'ㅉ', 0x314a: 'ㅊ', 
                0x314b: 'ㅋ', 0x314c: 'ㅌ', 0x314d: 'ㅍ', 0x314e: 'ㅎ'
            };
            if (singleConsonants[code]) return singleConsonants[code];
            return char.toLowerCase();
        }

        institutionSelect.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.altKey || e.metaKey) return;
            
            let pressedKey = e.key;
            if (!pressedKey) return;
            
            const mapped = keyToChosung[pressedKey.toLowerCase()];
            const searchChar = mapped || pressedKey.toLowerCase();
            
            const options = Array.from(institutionSelect.options);
            for (let i = 0; i < options.length; i++) {
                const optText = options[i].text;
                if (!optText || optText === '전체 도서관') continue;
                
                const optChosung = getChosung(optText);
                const firstChar = optText.charAt(0).toLowerCase();
                
                if (optChosung === searchChar || firstChar === searchChar || optText.toLowerCase().startsWith(searchChar)) {
                    institutionSelect.selectedIndex = i;
                    institutionSelect.dispatchEvent(new Event('change'));
                    e.preventDefault();
                    break;
                }
            }
        });

        // ── 날짜 및 오늘/내일 강좌 판단 헬퍼 함수 ──
        function getKoreaTodayDateOnly() {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: 'Asia/Seoul',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
            }).formatToParts(new Date());

            const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
            return new Date(Date.UTC(Number(values.year), Number(values.month) - 1, Number(values.day)));
        }

        function getKoreaTomorrowDateOnly() {
            const today = getKoreaTodayDateOnly();
            return new Date(today.getTime() + 24 * 60 * 60 * 1000);
        }

        function parseDateOnly(value) {
            if (!value) return null;
            const digits = String(value).replace(/\D/g, '');
            if (digits.length < 8) return null;
            const year = parseInt(digits.slice(0, 4), 10);
            const month = parseInt(digits.slice(4, 6), 10) - 1;
            const day = parseInt(digits.slice(6, 8), 10);
            const date = new Date(Date.UTC(year, month, day));
            if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month || date.getUTCDate() !== day) return null;
            return date;
        }

        function getApiDayCode(date) {
            const jsDay = date.getUTCDay();
            return jsDay === 0 ? '7' : String(jsDay);
        }

        function parseDayCodes(dayStr) {
            if (!dayStr) return [];
            const koreanMap = { '월': '1', '화': '2', '수': '3', '목': '4', '금': '5', '토': '6', '일': '7' };
            return String(dayStr)
                .split(/[,/|·\s]+/)
                .map(v => v.trim())
                .filter(Boolean)
                .map(v => v.replace(/요일$/, ''))
                .map(v => koreanMap[v] || v)
                .filter(v => /^[1-7]$/.test(v));
        }

        function isTodayLecture(d) {
            const today = getKoreaTodayDateOnly();
            const begin = parseDateOnly(d.beginDate);
            const end = parseDateOnly(d.endDate);
            if (!today || !begin || !end) return false;
            if (today < begin || today > end) return false;

            const dayCodes = parseDayCodes(d.dayOfWeek);
            if (dayCodes.length === 0) {
                return begin.getTime() === end.getTime() && today.getTime() === begin.getTime();
            }

            return dayCodes.includes(getApiDayCode(today));
        }

        function isTomorrowLecture(d) {
            const tomorrow = getKoreaTomorrowDateOnly();
            const begin = parseDateOnly(d.beginDate);
            const end = parseDateOnly(d.endDate);
            if (!tomorrow || !begin || !end) return false;
            if (tomorrow < begin || tomorrow > end) return false;

            const dayCodes = parseDayCodes(d.dayOfWeek);
            if (dayCodes.length === 0) {
                return begin.getTime() === end.getTime() && tomorrow.getTime() === begin.getTime();
            }

            return dayCodes.includes(getApiDayCode(tomorrow));
        }

        // ── 특정 선택 날짜 강좌/접수 여부 판단 및 핸들러 ──
        let selectedDateString = ''; // YYYY-MM-DD 포맷
        let selectedDateObj = null;  // Date 객체

        function isLectureOnDate(d, dateObj) {
            const begin = parseDateOnly(d.beginDate);
            const end = parseDateOnly(d.endDate);
            if (!dateObj || !begin || !end) return false;
            if (dateObj < begin || dateObj > end) return false;

            const dayCodes = parseDayCodes(d.dayOfWeek);
            if (dayCodes.length === 0) {
                return begin.getTime() === end.getTime() && dateObj.getTime() === begin.getTime();
            }

            return dayCodes.includes(getApiDayCode(dateObj));
        }

        function isApplyingOnDate(d, dateObj) {
            const begin = parseDateOnly(d.applyBegin);
            const end = parseDateOnly(d.applyEnd);
            if (!dateObj || !begin || !end) return false;
            return dateObj >= begin && dateObj <= end;
        }

        function openDatePicker(btn) {
            const picker = document.getElementById('filterDatePicker');
            if (typeof picker.showPicker === 'function') {
                picker.showPicker();
            } else {
                picker.click();
            }
        }

        function handleDateSelected(val) {
            if (!val) return;
            selectedDateString = val;
            const [year, month, day] = val.split('-').map(Number);
            selectedDateObj = new Date(Date.UTC(year, month - 1, day));

            currentFilter = 'date';
            displayPage = 1;

            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            const dateBtn = document.querySelector('.filter-btn.date-select');

        }

        function clearDateStateSilent() {
            selectedDateString = '';
            selectedDateObj = null;
            const picker = document.getElementById('filterDatePicker');
            if (picker) picker.value = '';
        }

        function clearDateFilter(e) {
            if (e) e.stopPropagation();
            clearDateStateSilent();

            if (currentFilter === 'date') {
                currentFilter = 'all';
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');

            renderResults();
        }

        initializeApp();

        // ── 로컬 스토리지 캐시 및 동기화 최적화 ──
        const CACHE_KEYS = {
            lectures: 'liblect_cached_lectures',
            meta: 'liblect_cached_meta',
            institutions: 'liblect_cached_institutions',
            lastSync: 'liblect_last_sync_time'
        };

        const SYNC_GRACE_PERIOD_MS = 30 * 60 * 1000; // 30분 그레이스 피리어드 (0ms 로딩 보장)
        const SYNC_TIER_1_MS = 4 * 60 * 60 * 1000;    // 4시간 이내: 최신 100개 동기화
        const SYNC_TIER_2_MS = 7 * 24 * 60 * 60 * 1000; // 7일 이내: 최신 500개 동기화

        function getLectureKey(d) {
            return d.lectureIdx || `${d.institution}_${d.name}_${d.beginDate}`;
        }

        function mergeLectures(existing, newItems) {
            const mergedMap = new Map();
            // 1. 기존 캐시 데이터 맵에 채우기
            existing.forEach(item => {
                const key = getLectureKey(item);
                if (key) mergedMap.set(key, item);
            });
            // 2. 신규 데이터 덮어쓰기 (실시간 인원 수, 상태 갱신 반영)
            newItems.forEach(item => {
                const key = getLectureKey(item);
                if (key) mergedMap.set(key, item);
            });
            // 3. 배열로 반환 및 beginDate 내림차순(최신순) 정렬
            return Array.from(mergedMap.values()).sort((a, b) => {
                return (b.beginDate || '').localeCompare(a.beginDate || '');
            });
        }

        function saveCacheToLocalStorage(lectures, meta, institutions, timestamp) {
            try {
                localStorage.setItem(CACHE_KEYS.lectures, JSON.stringify(lectures));
                localStorage.setItem(CACHE_KEYS.meta, JSON.stringify(meta));
                localStorage.setItem(CACHE_KEYS.institutions, JSON.stringify(Array.from(institutions)));
                localStorage.setItem(CACHE_KEYS.lastSync, String(timestamp));
            } catch (e) {
                console.error('로컬 스토리지 저장 실패:', e);
            }
        }

        function loadCacheFromLocalStorage() {
            try {
                const cachedLectures = localStorage.getItem(CACHE_KEYS.lectures);
                const cachedMeta = localStorage.getItem(CACHE_KEYS.meta);
                const cachedInst = localStorage.getItem(CACHE_KEYS.institutions);
                const lastSync = localStorage.getItem(CACHE_KEYS.lastSync);

                if (cachedLectures && cachedMeta) {
                    const lectures = JSON.parse(cachedLectures);
                    const meta = JSON.parse(cachedMeta);
                    const institutions = new Set(JSON.parse(cachedInst || '[]'));
                    const lastSyncTime = lastSync ? parseInt(lastSync, 10) : 0;

                    return { lectures, meta, institutions, lastSyncTime };
                }
            } catch (e) {
                console.error('로컬 스토리지 로드 실패:', e);
            }
            return null;
        }

        function showSyncBadge(message, status = 'loading') {
            const badge = document.getElementById('syncBadge');
            const text = document.getElementById('syncBadgeText');
            if (!badge || !text) return;

            text.textContent = message;
            badge.className = `sync-badge show ${status}`;
            
            const spinner = badge.querySelector('.spinner-mini');
            if (spinner) {
                spinner.style.display = (status === 'loading') ? 'block' : 'none';
            }

            if (status === 'success' || status === 'error') {
                if (badge._timeout) clearTimeout(badge._timeout);
                badge._timeout = setTimeout(() => {
                    badge.classList.remove('show');
                }, status === 'success' ? 2500 : 3500);
            }
        }

        function hideSyncBadge() {
            const badge = document.getElementById('syncBadge');
            if (badge) {
                badge.classList.remove('show');
                if (badge._timeout) clearTimeout(badge._timeout);
            }
        }

        // ── Worker 캐시에서 최근 도서관 데이터셋 가져오기 ──
        async function ensureLibraryDataLoaded() {
            if (dataLoadDone) return;
            if (isLoading) return;

            // 1단계: 동기적으로 localStorage 캐시 우선 로드 (즉각적인 화면 복구)
            const cached = loadCacheFromLocalStorage();
            let hasCache = false;

            if (cached && Array.isArray(cached.lectures) && cached.lectures.length > 0) {
                // 기존 캐시에 있는 전질 대출 / 전질대출 강좌 사전 배제
                libraryData = cached.lectures.filter(d => !isWholeSetLoan(d));
                datasetMeta = cached.meta;
                institutionNames = cached.institutions;
                
                // 오늘/내일 여부 실시간 업데이트
                libraryData.forEach(d => {
                    d.isToday = isTodayLecture(d);
                    d.isTomorrow = isTomorrowLecture(d);
                });
                
                populateInstitutionSelect();
                hasCache = true;
            }

            const now = Date.now();
            const lastSyncTime = cached ? cached.lastSyncTime : 0;
            const timeDiff = now - lastSyncTime;

            // 2단계: 캐시 유효기간(30분) 확인 및 동기화 필요 여부 결정
            if (hasCache && timeDiff < SYNC_GRACE_PERIOD_MS) {
                dataLoadDone = true;
                return;
            }

            // 동기화 모드 결정
            let syncMode = 'full'; 
            let fetchUrl = LIBRARY_DATA_API;
            let syncMessage = '🔄 전체 데이터 동기화 중...';

            if (hasCache) {
                if (timeDiff < SYNC_TIER_1_MS) {
                    syncMode = 'tier1';
                    fetchUrl = `${LIBRARY_DATA_API}?limit=100`;
                    syncMessage = '🔄 최신 데이터 업데이트 중... (100개)';
                } else if (timeDiff < SYNC_TIER_2_MS) {
                    syncMode = 'tier2';
                    fetchUrl = `${LIBRARY_DATA_API}?limit=500`;
                    syncMessage = '🔄 최신 데이터 업데이트 중... (500개)';
                }
            }

            isLoading = true;

            if (abortController) abortController.abort();
            abortController = new AbortController();

            const contentEl = document.getElementById('content');
            
            // 캐시가 없는 최초 진입일 때는 화면 차단 로딩바 사용
            if (!hasCache) {
                contentEl.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>최근 도서관 강좌 목록을 가져오는 중...</p>
                    </div>`;
            } else {
                // 기존 캐시가 있을 때는 백그라운드로 실행하고 고급 플로팅 배지 노출
                showSyncBadge(syncMessage, 'loading');
            }

            try {
                const res = await fetch(fetchUrl, { signal: abortController.signal });
                if (!res.ok) {
                    throw new Error(`동기화 API 응답 오류: ${res.status}`);
                }
                const payload = await res.json();
                const rawFetched = Array.isArray(payload.lectures) ? payload.lectures : [];
                const fetchedLectures = rawFetched.filter(d => !isWholeSetLoan(d));

                if (syncMode === 'full') {
                    libraryData = fetchedLectures;
                } else {
                    libraryData = mergeLectures(libraryData, fetchedLectures);
                }

                // 오늘/내일 강좌 상태 갱신
                libraryData.forEach(d => {
                    d.isToday = isTodayLecture(d);
                    d.isTomorrow = isTomorrowLecture(d);
                });

                datasetMeta = payload.meta || datasetMeta;
                
                const newInsts = Array.isArray(payload.institutions)
                    ? payload.institutions
                    : fetchedLectures.map(d => d.institution).filter(Boolean);
                
                if (syncMode === 'full') {
                    institutionNames = new Set(newInsts);
                } else {
                    newInsts.forEach(inst => institutionNames.add(inst));
                }

                populateInstitutionSelect();

                // 3단계: 캐시 보존 및 타임스탬프 갱신
                saveCacheToLocalStorage(libraryData, datasetMeta, institutionNames, now);

                if (hasCache) {
                    showSyncBadge('✅ 강좌 데이터 동기화 완료!', 'success');
                    // 현재 검색 및 필터 조건 갱신 및 리렌더링
                    allData = getSearchBaseData();
                    updateFilterButtons(getFilterCounts(allData));
                    renderResults();
                }
                
                dataLoadDone = true;
            } catch (e) {
                if (e.name === 'AbortError') { 
                    isLoading = false; 
                    return; 
                }
                
                console.error('동기화 실패:', e);

                if (hasCache) {
                    // 캐시가 존재할 때 통신 에러가 나면, 캐시 데이터로 백오프 작동 (오프라인 모드 배지 팝업)
                    showSyncBadge('⚠️ 업데이트 실패 (기존 캐시 사용)', 'error');
                    dataLoadDone = true; 
                } else {
                    contentEl.innerHTML = `<div class="error-msg"><h3>데이터를 불러오지 못했습니다</h3><p>${e.message}</p></div>`;
                    isLoading = false;
                    throw e;
                }
            }

            isLoading = false;
        }

        // ── 검색 시작 ──
        async function doSearch() {
            const keyword = searchInput.value.trim();
            if (isLoading) return;

            // 상태 초기화
            clearDateStateSilent();
            currentKeyword = keyword;
            allData = [];
            displayPage = 1;
            searchDone = true;
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');

            document.getElementById('searchBtn').disabled = true;

            try {
                await ensureLibraryDataLoaded();
                allData = getSearchBaseData();
            } catch (e) {
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = `<div class="error-msg"><h3>데이터를 불러오지 못했습니다</h3><p>${e.message}</p></div>`;
                document.getElementById('searchBtn').disabled = false;
                return;
            }

            document.getElementById('searchBtn').disabled = false;

            updateFilterButtons(getFilterCounts(allData));

            if (allData.length === 0) {
                const contentEl = document.getElementById('content');
                contentEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">&#128533;</div>
                        <h3>검색 결과가 없습니다</h3>
                        <p>도서관 선택이나 검색어를 바꿔 보세요</p>
                    </div>`;
                return;
            }

            renderResults();
        }

        // ── "다음" 버튼: 다음 12개 불러오기 ──
        async function loadNextPage() {
            const filtered = getFilteredData();
            const maxPage = Math.ceil(filtered.length / CARDS_PER_PAGE);
            if (displayPage < maxPage) {
                displayPage++;
            }

            renderResults();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        // ── "전체" 버튼 ──
        async function loadAll() {
            displayPage = 1;
            renderResults();
        }

        // ── 필터 ──
        async function setFilter(filter, btn) {
            if (filter !== 'date') {
                clearDateStateSilent();
            }
            currentFilter = filter;
            displayPage = 1;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderResults();
        }

        function getStatusPriority(d) {
            if (d.isToday) return 0;
            if (d.isTomorrow) return 1;
            if (d.status === '접수중') return 2;
            if (d.status === '접수예정') return 3;
            if (d.status === '접수마감') return 4;
            if (d.status === '강좌종료') return 5;
            return 6;
        }

        function getFilteredData() {
            let data = [...allData];
            if (currentFilter === 'today') {
                data = data.filter(d => d.isToday);
            } else if (currentFilter === 'tomorrow') {
                data = data.filter(d => d.isTomorrow);
            } else if (currentFilter === 'date') {
                if (selectedDateObj) {
                    data = data.filter(d => isLectureOnDate(d, selectedDateObj) || isApplyingOnDate(d, selectedDateObj));
                } else {
                    data = [];
                }
            } else if (currentFilter !== 'all') {
                data = data.filter(d => d.status === currentFilter);
            }
            data.sort((a, b) => {
                const prioA = getStatusPriority(a);
                const prioB = getStatusPriority(b);
                if (prioA !== prioB) {
                    return prioA - prioB;
                }
                if (a.isToday || a.isTomorrow) {
                    return (a.beginTime || '').localeCompare(b.beginTime || '');
                }
                return (b.beginDate || '').localeCompare(a.beginDate || '');
            });
            return data;
        }

        // ── 렌더링 ──
        function renderResults() {
            const contentEl = document.getElementById('content');
            const filtered = getFilteredData();
            const totalFiltered = filtered.length;
            const totalPages = Math.ceil(totalFiltered / CARDS_PER_PAGE);
            const start = (displayPage - 1) * CARDS_PER_PAGE;
            const pageData = filtered.slice(start, start + CARDS_PER_PAGE);

            const hasNextPageData = displayPage < totalPages;

            const counts = getFilterCounts(allData);
            updateFilterButtons(counts);

            let html = `
                <div class="status-bar">
                    <div class="result-count">
                        <span class="count-segment total">전체 <strong>${allData.length}</strong>건 발견</span>
                        ${currentFilter !== 'all' ? `
                            <span class="count-divider"></span>
                            <span class="count-segment filter">"${getFilterLabel(currentFilter)}" <strong>${totalFiltered}</strong>건</span>
                        ` : ''}
                        ${institutionSelect.value ? `
                            <span class="count-divider"></span>
                            <span class="count-segment inst">🏛️ ${escapeHtml(institutionSelect.value)}</span>
                        ` : ''}
                        ${currentKeyword ? `
                            <span class="count-divider"></span>
                            <span class="count-segment keyword">🔍 "${escapeHtml(currentKeyword)}"</span>
                        ` : ''}
                    </div>
                </div>
                <div class="card-grid">`;

            pageData.forEach(d => {
                html += renderCard(d);
            });

            html += '</div>';

            // ── 하단: 페이지 번호 + 다음 + 전체 버튼 ──
            html += '<div class="pagination">';

            // 이전 버튼
            if (displayPage > 1) {
                html += `<button class="page-btn" onclick="goPage(${displayPage - 1})">이전</button>`;
            }

            // 페이지 번호들
            if (totalPages > 1) {
                const startP = Math.max(1, displayPage - 4);
                const endP = Math.min(totalPages, startP + 9);
                for (let i = startP; i <= endP; i++) {
                    html += `<button class="page-btn ${i === displayPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
                }
            }

            // 다음 버튼: 아직 더 불러올 데이터가 있으면 표시
            if (hasNextPageData || !searchDone) {
                html += `<button class="page-btn btn-next" onclick="loadNextPage()">다음 ></button>`;
            }

            // 전체 버튼: 아직 API를 끝까지 읽지 않았으면 표시
            if (!searchDone) {
                html += `<button class="page-btn btn-all" onclick="loadAll()">전체</button>`;
            }

            html += '</div>';

            contentEl.innerHTML = html;
        }

        function renderCard(d) {
            const isToday = d.isToday;
            const isTomorrow = d.isTomorrow;
            const cardClasses = ['card', `status-${getStatusClass(d.status)}`];
            if (isToday) cardClasses.push('today-card');
            else if (isTomorrow) cardClasses.push('tomorrow-card');

            return `
                <div class="${cardClasses.join(' ')}">
                    ${isToday ? '<div class="today-badge">오늘수업</div>' : ''}
                    ${isTomorrow ? '<div class="tomorrow-badge">내일수업</div>' : ''}
                    <div class="card-status ${getStatusClass(d.status)}">${d.status}</div>
                    <div class="card-institution">${d.institution}</div>
                    <div class="card-title">${escapeHtml(d.name)}</div>
                    <div class="card-info">
                        <div class="card-info-item">
                            <span class="label">기간</span>
                            <span>${d.beginDate} ~ ${d.endDate}</span>
                        </div>
                        <div class="card-info-item">
                            <span class="label">시간</span>
                            <span>${d.beginTime} ~ ${d.endTime} (${getDayNames(d.dayOfWeek)})</span>
                        </div>
                        <div class="card-info-item">
                            <span class="label">장소</span>
                            <span>${escapeHtml(d.place)}</span>
                        </div>
                        ${d.applyBegin ? `<div class="card-info-item">
                            <span class="label">접수</span>
                            <span>${d.applyBegin} ~ ${d.applyEnd}</span>
                        </div>` : ''}
                        ${d.reference ? `<div class="card-info-item">
                            <span class="label">문의</span>
                            <span>${d.reference}</span>
                        </div>` : ''}
                    </div>
                    <div class="card-tags">
                        ${d.targetNm ? `<span class="tag tag-target">${d.targetNm}${d.targetDetail ? ' / ' + escapeHtml(d.targetDetail) : ''}</span>` : ''}
                        <span class="tag ${d.price === 0 ? 'tag-free' : 'tag-paid'}">${d.freeNm || (d.price === 0 ? '무료' : d.price.toLocaleString() + '원')}</span>
                        ${d.classNm ? `<span class="tag tag-class">${d.classNm}</span>` : ''}
                    </div>
                    <div class="card-footer">
                        <div class="card-apply">
                            신청 <strong>${d.applyUserNum}</strong>/${d.applyLimitNum}명
                            ${parseInt(d.waitLimitNum) > 0 ? ` &middot; 대기 ${d.waitUserNum}/${d.waitLimitNum}명` : ''}
                        </div>
                        ${d.detailUrl ? `<a class="card-link" href="${d.detailUrl}" target="_blank">상세보기</a>` : ''}
                    </div>
                </div>`;
        }

        function goPage(page) {
            displayPage = page;
            renderResults();
            window.scrollTo({ top: 300, behavior: 'smooth' });
        }

        function getDayNames(dayStr) {
            const map = { '1': '월', '2': '화', '3': '수', '4': '목', '5': '금', '6': '토', '7': '일' };
            if (!dayStr) return '';
            return dayStr.split(',').map(d => map[d.trim()] || d.trim()).join(', ');
        }

        function getFilterLabel(filter) {
            if (filter === 'today') return '오늘수업';
            if (filter === 'tomorrow') return '내일수업';
            if (filter === 'date') {
                if (selectedDateObj) {
                    const m = String(selectedDateObj.getUTCMonth() + 1).padStart(2, '0');
                    const d = String(selectedDateObj.getUTCDate()).padStart(2, '0');
                    return `${m}월 ${d}일 수업/접수`;
                }
                return '선택된 날짜';
            }
            return filter;
        }

        function populateInstitutionSelect() {
            const saved = localStorage.getItem('selectedInstitution');
            const selected = institutionSelect.value || saved;
            
            // "화성시문화관광재단 도서관사업팀"을 제외한 일반 도서관 목록 (가나다 순 정렬)
            const selectableNames = [...institutionNames]
                .filter(name => name.includes('도서관') && name !== '화성시문화관광재단 도서관사업팀')
                .sort((a, b) => a.localeCompare(b, 'ko'));
            
            const options = ['<option value="">전체 도서관</option>'];
            
            selectableNames.forEach(name => {
                options.push(`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`);
            });
            
            // "화성시문화관광재단 도서관사업팀"이 institutionNames에 있을 때만 구분선 및 항목 추가
            const hasLibraryTeam = institutionNames.has('화성시문화관광재단 도서관사업팀');
            if (hasLibraryTeam) {
                options.push('<option disabled>────────────────────</option>');
                options.push(`<option value="화성시문화관광재단 도서관사업팀">화성시문화관광재단 도서관사업팀</option>`);
            }
            
            institutionSelect.innerHTML = options.join('');
            
            const allSelectable = [...selectableNames];
            if (hasLibraryTeam) {
                allSelectable.push('화성시문화관광재단 도서관사업팀');
            }
            
            if (allSelectable.includes(selected)) {
                institutionSelect.value = selected;
            }
        }

        function isWholeSetLoan(d) {
            if (!d) return false;
            const blob = getSearchBlob(d);
            return blob.includes('전질 대출') || blob.includes('전질대출');
        }

        function getSearchBaseData() {
            const selectedInstitution = institutionSelect.value;
            const keyword = currentKeyword.toLowerCase();
            return libraryData.filter(d => {
                // 전체도서관 검색일 때는 "화성시문화관광재단 도서관사업팀" 강좌 제외
                if (!selectedInstitution && d.institution === '화성시문화관광재단 도서관사업팀') return false;
                
                if (selectedInstitution && d.institution !== selectedInstitution) return false;
                
                // 전질 대출 / 전질대출 2차 방어
                if (isWholeSetLoan(d)) return false;

                if (!keyword) return true;
                return getSearchBlob(d).includes(keyword);
            });
        }

        function getSearchBlob(d) {
            return Object.values(d)
                .filter(value => value !== null && value !== undefined)
                .map(value => String(value))
                .join(' ')
                .toLowerCase();
        }

        function getFilterCounts(data) {
            const counts = {
                all: data.length,
                today: 0,
                tomorrow: 0,
                '접수중': 0,
                '접수예정': 0,
                '접수마감': 0,
                '강좌종료': 0,
                date: 0,
            };
            data.forEach(d => {
                if (d.isToday) counts.today++;
                if (d.isTomorrow) counts.tomorrow++;
                if (selectedDateObj && (isLectureOnDate(d, selectedDateObj) || isApplyingOnDate(d, selectedDateObj))) {
                    counts.date++;
                }
                if (Object.prototype.hasOwnProperty.call(counts, d.status)) {
                    counts[d.status]++;
                }
            });
            return counts;
        }

        function updateFilterButtons(counts) {
            const labels = {
                all: '전체',
                today: '오늘수업',
                tomorrow: '내일수업',
                '접수중': '접수중',
                '접수예정': '접수예정',
                '접수마감': '접수마감',
                '강좌종료': '강좌종료',
            };
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const filter = btn.dataset.filter;
                if (filter === 'date') {
                    if (selectedDateObj) {
                        const m = String(selectedDateObj.getUTCMonth() + 1).padStart(2, '0');
                        const d = String(selectedDateObj.getUTCDate()).padStart(2, '0');
                        btn.innerHTML = `📅 달력선택: ${m}.${d}(${counts.date || 0}) <span class="clear-date-btn" onclick="clearDateFilter(event)" title="선택 해제">✖</span>`;
                    } else {
                        btn.innerHTML = `📅 달력선택`;
                    }
                } else {
                    btn.textContent = `${labels[filter] || filter}(${counts[filter] || 0})`;
                }
            });
        }

        function getSearchSummary() {
            const parts = [];
            if (institutionSelect.value) parts.push(`기관: ${escapeHtml(institutionSelect.value)}`);
            if (currentKeyword) parts.push(`검색어: ${escapeHtml(currentKeyword)}`);
            return parts.length ? ` &middot; ${parts.join(' · ')}` : '';
        }

        async function initializeApp() {
            document.getElementById('searchBtn').disabled = true;
            try {
                await ensureLibraryDataLoaded();
                if (institutionSelect.value) {
                    doSearch();
                } else {
                    allData = getSearchBaseData();
                    updateFilterButtons(getFilterCounts(allData));
                    document.getElementById('content').innerHTML = `
                        <div class="empty-state">
                            <div class="icon">&#128218;</div>
                            <h3>도서관을 선택하거나 검색어를 입력해 보세요</h3>
                            <p>강좌명, 대상, 장소, 무료 여부까지 한 번에 검색할 수 있습니다</p>
                        </div>`;
                }
            } catch (e) {
                // ensureLibraryDataLoaded에서 오류 화면을 표시합니다.
            }
            document.getElementById('searchBtn').disabled = false;
        }

        function getStatusClass(status) {
            if (status === '접수중') return 'open';
            if (status === '접수예정') return 'upcoming';
            if (status === '접수마감') return 'closed';
            return 'ended';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }
    </script>
</body>
</html>
